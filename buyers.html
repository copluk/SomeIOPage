<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購買者管理 - 內部貿易系統</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

<div id="app" class="flex h-screen">

    <nav class="w-64 bg-white shadow-lg flex-shrink-0 flex flex-col">
        <a href="./products.html" class="p-4 border-b flex items-center gap-3 hover:bg-gray-50 transition-colors">
            <i class="fas fa-chart-line text-3xl text-indigo-600"></i>
            <h1 class="text-xl font-bold text-gray-800">內部貿易系統</h1>
        </a>
        <ul class="flex-grow">
            <li><a href="./suppliers.html" data-page="suppliers" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-truck w-5 text-center"></i><span>供應商管理</span></a></li>
            <li><a href="./buyers.html" data-page="buyers" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-users w-5 text-center"></i><span>購買者管理</span></a></li>
            <li><a href="./products.html" data-page="products" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-box-open w-5 text-center"></i><span>產品管理</span></a></li>
            <li><a href="./attributes.html" data-page="attributes" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-tags w-5 text-center"></i><span>產品屬性管理</span></a></li>
            <li><a href="./orders.html" data-page="orders" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-file-invoice-dollar w-5 text-center"></i><span>訂單管理</span></a></li>
            <li>
                <a href="./orderFinance.html" data-page="orderFinance" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200">
                    <i class="fas fa-chart-pie w-5 text-center"></i>
                    <span>訂單利潤</span>
                </a>
            </li>
        </ul>
    </nav>

    <main class="flex-1 p-6 md:p-8 overflow-y-auto bg-gray-50">

        <div class="fade-in">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold text-gray-900">購買者管理</h2>
                <a href="./buyer-edit.html" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700 transition duration-200 shadow-sm">
                    <i class="fas fa-plus mr-2"></i>新增購買者
                </a>
            </div>

            <div class="mb-4"><div class="relative"><span class="absolute inset-y-0 left-0 flex items-center pl-3"><i class="fas fa-search text-gray-400"></i></span><input type="text" placeholder="依購買者名稱搜尋..." class="w-full md:w-1/3 p-2 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"></div></div>

            <div class="bg-white shadow-lg rounded-lg overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead class="bg-gray-100">
                    <tr>
                        <th class="p-4 text-left font-semibold text-gray-600">購買者公司名稱</th>
                        <th class="p-4 text-left font-semibold text-gray-600">我方業務負責人</th>
                        <th class="p-4 text-left font-semibold text-gray-600">主要聯絡人(外部)</th>
                        <th class="p-4 text-left font-semibold text-gray-600">聯絡人Email</th>
                        <th class="p-4 text-left font-semibold text-gray-600">聯絡電話</th>
                        <th class="p-4 text-left font-semibold text-gray-600">備註</th>
                        <th class="p-4 text-left font-semibold text-gray-600">操作</th>
                    </tr>
                    </thead>
                    <tbody id="buyers-table-body" class="divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<script>
    // --- 假資料，請替換為您提供的 dataEntity.md 對應的 JSON ---
    const db = {
        Users: [
            { UserID: 1, FullName: "林業務" },
            { UserID: 2, FullName: "陳經理" }
        ],
        Buyers: [
            { BuyerID: 101, BuyerName: "A級牛排館", Remarks: "偏好油花較少的部位。" },
            { BuyerID: 102, BuyerName: "饗食天堂餐飲集團", Remarks: "集團統一採購，需附檢驗報告。" }
        ],
        Buyer_User_Assignments: [
            { BuyerID: 101, UserID: 1, ResponsibilityType: '主要業務' },
            { BuyerID: 102, UserID: 2, ResponsibilityType: '主要業務' }
        ],
        Buyer_Contacts: [
            { ContactID: 1011, BuyerID: 101, ContactName: "陳主廚", ContactRole: "主廚", Email: "chen.chef@asteak.com", Phone: "0912-345-678", IsPrimary: true },
            { ContactID: 1021, BuyerID: 102, ContactName: "採購部林先生", ContactRole: "採購經理", Email: "procurement.lin@eat-together.com", Phone: "02-8780-8000", IsPrimary: true },
            { ContactID: 1022, BuyerID: 102, ContactName: "財務部黃小姐", ContactRole: "財務", Email: "finance.huang@eat-together.com", Phone: "02-8780-8001", IsPrimary: false },
        ]
    };

    // --- 共用輔助函式 (Helper Functions) ---
    const findById = (collectionName, id, keyName) => db[collectionName].find(item => item[keyName] === id);
    const highlightCurrentNav = () => {
        let currentPage = window.location.pathname.split('/').pop().replace('.html', '');
        if (!currentPage || currentPage === 'index') { currentPage = 'products'; }
        const activeLink = document.querySelector(`a[data-page="${currentPage}"]`);
        if (activeLink) {
            activeLink.classList.add('bg-indigo-50', 'text-indigo-600', 'font-bold', 'border-l-4', 'border-indigo-600');
        }
    };

    // --- buyers.html 頁面專屬的 JavaScript 邏輯 ---
    function renderBuyerTable() {
        const tableBody = document.getElementById('buyers-table-body');
        if (!tableBody) return;
        tableBody.innerHTML = db.Buyers.map(buyer => {
            const assignment = db.Buyer_User_Assignments.find(a => a.BuyerID === buyer.BuyerID);
            const ourContact = assignment ? findById('Users', assignment.UserID, 'UserID') : null;
            const primaryExternalContact = db.Buyer_Contacts.find(c => c.BuyerID === buyer.BuyerID && c.IsPrimary);
            return `
                <tr class="hover:bg-gray-50">
                    <td class="p-4 font-semibold">${buyer.BuyerName}</td>
                    <td class="p-4">${ourContact?.FullName || '-'}</td>
                    <td class="p-4">${primaryExternalContact?.ContactName || '-'}</td>
                    <td class="p-4">${primaryExternalContact?.Email || '-'}</td>
                    <td class="p-4">${primaryExternalContact?.Phone || '-'}</td>
                    <td class="p-4 text-gray-600 truncate" title="${buyer.Remarks}" style="max-width: 200px;">${buyer.Remarks}</td>
                    <td class="p-4 whitespace-nowrap">
                        <a href="./buyer-edit.html?id=${buyer.BuyerID}" class="text-indigo-600 hover:text-indigo-800 font-semibold text-sm">編輯</a>
                        <a href="./buyer-detail.html?id=${buyer.BuyerID}" class="ml-4 text-gray-600 hover:text-gray-800 font-semibold text-sm">查看詳情</a>
                    </td>
                </tr>
            `;
        }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
        highlightCurrentNav();
        renderBuyerTable();
    });

</script>
</body>
</html>
