<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單利潤列表 - 內部貿易系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div id="app" class="flex h-screen">

        <nav class="w-64 bg-white shadow-lg flex-shrink-0 flex flex-col">
            <a href="./products.html" class="p-4 border-b flex items-center gap-3 hover:bg-gray-50 transition-colors">
                <i class="fas fa-chart-line text-3xl text-indigo-600"></i>
                <h1 class="text-xl font-bold text-gray-800">內部貿易系統</h1>
            </a>
            <ul class="flex-grow">
                <li>
                    <a href="./suppliers.html" data-page="suppliers" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200">
                        <i class="fas fa-truck w-5 text-center"></i>
                        <span>供應商管理</span>
                    </a>
                </li>
                <li>
                    <a href="./buyers.html" data-page="buyers" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200">
                        <i class="fas fa-users w-5 text-center"></i>
                        <span>購買者管理</span>
                    </a>
                </li>
                <li>
                    <a href="./products.html" data-page="products" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200">
                        <i class="fas fa-box-open w-5 text-center"></i>
                        <span>產品管理</span>
                    </a>
                </li>
                <li>
                    <a href="./attributes.html" data-page="attributes" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200">
                        <i class="fas fa-tags w-5 text-center"></i>
                        <span>產品屬性管理</span>
                    </a>
                </li>
                <li>
                    <a href="./orders.html" data-page="orders" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200">
                        <i class="fas fa-file-invoice-dollar w-5 text-center"></i>
                        <span>訂單管理</span>
                    </a>
                </li>
                <li>
                    <a href="./orderFinance.html" data-page="orderFinance" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200">
                        <i class="fas fa-chart-pie w-5 text-center"></i>
                        <span>訂單利潤</span>
                    </a>
                </li>
            </ul>
        </nav>

        <main class="flex-1 p-6 md:p-8 overflow-y-auto bg-gray-50">
            <div class="fade-in max-w-full mx-auto">
                <h2 class="text-3xl font-bold text-gray-900 mb-6">訂單利潤列表</h2>

                <!-- 8.1 篩選面板 -->
                <div class="bg-white p-4 rounded-lg shadow-sm mb-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 xl:grid-cols-6 gap-4">
                        <input type="text" placeholder="訂單編號..." class="p-2 border border-gray-300 rounded-lg text-sm">
                        <input type="text" placeholder="購買者..." class="p-2 border border-gray-300 rounded-lg text-sm">
                        <input type="text" placeholder="供應商..." class="p-2 border border-gray-300 rounded-lg text-sm">
                        <div>
                            <label for="date-range" class="text-xs text-gray-500">成交日期區間</label>
                            <input type="date" id="date-range" class="p-2 border border-gray-300 rounded-lg text-sm w-full">
                        </div>
                        <div class="flex items-end space-x-2">
                            <button class="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700">查詢</button>
                            <button class="w-full bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-lg hover:bg-gray-300">清除</button>
                        </div>
                    </div>
                </div>

                <!-- 8.1 訂單表格 -->
                <div class="bg-white shadow-lg rounded-lg overflow-x-auto">
                    <table class="min-w-full text-sm">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="p-3 text-left font-semibold">訂單編號</th>
                                <th class="p-3 text-left font-semibold">購買者</th>
                                <th class="p-3 text-left font-semibold">供應商</th>
                                <th class="p-3 text-left font-semibold">成交日期</th>
                                <th class="p-3 text-right font-semibold">總重量</th>
                                <th class="p-3 text-right font-semibold">總成本</th>
                                <th class="p-3 text-right font-semibold">總售價</th>
                                <th class="p-3 text-right font-semibold">總利潤</th>
                                <th class="p-3 text-right font-semibold">訂單利潤率</th>
                                <th class="p-3 text-center font-semibold">操作</th>
                            </tr>
                        </thead>
                        <tbody id="finance-table-body" class="divide-y divide-gray-200">
                            <!-- Static example row -->
                            <tr class="hover:bg-gray-50">
                                <td class="p-3 font-mono">ORD-202506-010</td>
                                <td class="p-3">A級牛排館</td>
                                <td class="p-3">環球肉品公司</td>
                                <td class="p-3">2025-06-03</td>
                                <td class="p-3 text-right">370.50 kg</td>
                                <td class="p-3 text-right text-red-600">$571,035</td>
                                <td class="p-3 text-right text-green-600">$684,930</td>
                                <td class="p-3 text-right text-blue-600 font-bold">$113,895</td>
                                <td class="p-3 text-right text-blue-600 font-bold">16.63%</td>
                                <td class="p-3 text-center">
                                    <a href="./orderFinance-detail.html?id=10" class="text-indigo-600 hover:text-indigo-800 font-semibold">查看詳情</a>
                                </td>
                            </tr>
                            <!-- Add more static rows for demonstration -->
                            <tr class="hover:bg-gray-50">
                                <td class="p-3 font-mono">ORD-202505-003</td>
                                <td class="p-3">饗食天堂餐飲集團</td>
                                <td class="p-3">頂級海鮮直送</td>
                                <td class="p-3">2025-05-15</td>
                                <td class="p-3 text-right">850.00 kg</td>
                                <td class="p-3 text-right text-red-600">$750,000</td>
                                <td class="p-3 text-right text-green-600">$920,000</td>
                                <td class="p-3 text-right text-blue-600 font-bold">$170,000</td>
                                <td class="p-3 text-right text-blue-600 font-bold">18.48%</td>
                                <td class="p-3 text-center">
                                    <a href="./orderFinance-detail.html?id=11" class="text-indigo-600 hover:text-indigo-800 font-semibold">查看詳情</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const db = { /* ... db object ... */ };
        // JS for highlighting nav and handling events would go here
        document.addEventListener('DOMContentLoaded', () => {
            const currentPage = 'orderFinance';
            const activeLink = document.querySelector(`a[data-page="${currentPage}"]`);
            if (activeLink) {
                activeLink.classList.add('bg-indigo-50', 'text-indigo-600', 'font-bold', 'border-l-4', 'border-indigo-600');
            }
        });
    </script>
</body>
</html>
