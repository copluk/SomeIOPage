<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>產品詳情 - 內部貿易系統</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details > summary::before { content: '\f0da'; font-family: 'Font Awesome 6 Free'; font-weight: 900; margin-right: 0.5rem; transition: transform 0.2s ease-in-out; display: inline-block; }
        details[open] > summary::before { transform: rotate(90deg); }
        body.modal-open { overflow: hidden; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

<div id="app" class="flex h-screen">

    <nav class="w-64 bg-white shadow-lg flex-shrink-0 flex flex-col">
        <a href="./products.html" class="p-4 border-b flex items-center gap-3 hover:bg-gray-50 transition-colors">
            <i class="fas fa-chart-line text-3xl text-indigo-600"></i>
            <h1 class="text-xl font-bold text-gray-800">內部貿易系統</h1>
        </a>
        <ul class="flex-grow">
            <li><a href="./suppliers.html" data-page="suppliers" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-truck w-5 text-center"></i><span>供應商管理</span></a></li>
            <li><a href="./buyers.html" data-page="buyers" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-users w-5 text-center"></i><span>購買者管理</span></a></li>
            <li><a href="./products.html" data-page="products" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-box-open w-5 text-center"></i><span>產品管理</span></a></li>
            <li><a href="./attributes.html" data-page="attributes" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-tags w-5 text-center"></i><span>產品屬性管理</span></a></li>
            <li><a href="./orders.html" data-page="orders" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-file-invoice-dollar w-5 text-center"></i><span>訂單管理</span></a></li>
        </ul>
    </nav>

    <main id="page-content" class="flex-1 p-6 md:p-8 overflow-y-auto bg-gray-50">
        <div class="text-center text-gray-500">正在載入資料...</div>
    </main>
</div>

<div id="modal-container" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 p-4 fade-in"></div>

<script>
    // --- 資料模型 (Data Model) ---
    const db = {
         Users: [ { UserID: 1, FullName: "林業務" }, { UserID: 2, FullName: "陳經理" } ],
         Suppliers: [ { SupplierID: 1, SupplierName: "環球肉品公司" }, { SupplierID: 2, SupplierName: "頂級海鮮直送" } ],
         Buyers: [ { BuyerID: 101, BuyerName: "A級牛排館" }, { BuyerID: 102, BuyerName: "饗食天堂餐飲集團" } ],
         Production_Areas: [ { AreaID: 8, AreaName: "澳洲" }, { AreaID: 6, AreaName: "西班牙" } ],
         Supplier_Production_Numbers: [ { ProdNumID: 1, ProductionNumber: "SIF 121" }, { ProdNumID: 2, ProductionNumber: "ESP 456" } ],
         Sub_Brands: [ { SubBrandID: 1, SubBrandName: "World's Best Beef" }, { SubBrandID: 2, SubBrandName: "Iberico Gold" } ],
         Product_Categories: [ { CategoryID: 1, PartName_ZH: "牛肉" }, { CategoryID: 2, PartName_ZH: "豬肉" } ],
         Product_Parts: [ { PartID: 1, PartName_ZH: "肋眼" }, { PartID: 3, PartName_ZH: "梅花" } ],
         Product_Specs: [ { SpecID: 1, SpecName_ZH: "M9" }, { SpecID: 2, SpecName_ZH: "Bellota" } ],
         Product_Packagings: [ { PackagingID: 2, PackagingName_ZH: "原塊" }, { PackagingID: 4, PackagingName_ZH: "真空包裝" } ],
         Products: [ { ProductID: 1, SupplierID: 1, CategoryID: 1, PartID: 1, SpecID: 1, PackagingID: 2, ProductDisplayName: "澳洲和牛M9肋眼", ProductCode: "AW-RB-G9-001", AreaID: 8, ProdNumID: 1, SubBrandID: 1 }, { ProductID: 2, SupplierID: 1, CategoryID: 2, PartID: 3, SpecID: 2, PackagingID: 4, ProductDisplayName: "西班牙伊比利豬梅花", ProductCode: "SP-Pork-001", AreaID: 6, ProdNumID: 2, SubBrandID: 2 }, ],
         Supplier_Quotes: [ { SupplierQuoteID: 1, ProductID: 1, EffectiveTimestamp: "2025-05-20T00:00:00Z", SupplierOriginalPrice: 1800, InternalCostPrice: 1850 }, { SupplierQuoteID: 2, ProductID: 1, EffectiveTimestamp: "2025-06-01T00:00:00Z", SupplierOriginalPrice: 1820, InternalCostPrice: 1870 }, { SupplierQuoteID: 3, ProductID: 1, EffectiveTimestamp: "2025-06-10T00:00:00Z", SupplierOriginalPrice: 1810, InternalCostPrice: 1860 }, { SupplierQuoteID: 4, ProductID: 2, EffectiveTimestamp: "2025-06-08T00:00:00Z", SupplierOriginalPrice: 805, InternalCostPrice: 855 } ],
         Quotes_To_Buyers: [ { QuoteToBuyerID: 1, SupplierQuoteID: 3, ProductID: 1, BuyerID: 101, QuotedPrice: 2200, CustomerExpectedPrice: null, BID: null, QuoteTimestamp: "2025-06-11T10:00:00Z", Status: "Negotiating", QuotedCostPrice: 1860 }, { QuoteToBuyerID: 2, SupplierQuoteID: 3, ProductID: 1, BuyerID: 101, QuotedPrice: null, CustomerExpectedPrice: 2150, BID: 2160, QuoteTimestamp: "2025-06-11T11:00:00Z", Status: "Negotiating", QuotedCostPrice: 1860 }, { QuoteToBuyerID: 3, SupplierQuoteID: 3, ProductID: 1, BuyerID: 102, QuotedPrice: 2250, CustomerExpectedPrice: 2240, BID: 2240, QuoteTimestamp: "2025-06-12T09:30:00Z", Status: "Negotiating", QuotedCostPrice: 1860 }, { QuoteToBuyerID: 10, SupplierQuoteID: 2, ProductID: 1, BuyerID: 101, QuotedPrice: 2280, CustomerExpectedPrice: 2260, BID: 2260, QuoteTimestamp: "2025-06-02T11:00:00Z", Status: "Ordered", FinalSellingPrice: 2260, FinalCostPrice: 1870, QuotedCostPrice: 1870 },{
    "QuoteToBuyerID": 11,
    "SupplierQuoteID": 1,
    "ProductID": 1,
    "BuyerID": 101,
    "QuotedPrice": 2300,
    "CustomerExpectedPrice": null,
    "BID": null,
    "QuoteTimestamp": "2025-05-21T10:00:00Z",
    "Status": "Negotiating",
    "QuotedCostPrice": 1850
  },
  {
    "QuoteToBuyerID": 12,
    "SupplierQuoteID": 1,
    "ProductID": 1,
    "BuyerID": 101,
    "QuotedPrice": 2280,
    "CustomerExpectedPrice": 2270,
    "BID": 2270,
    "QuoteTimestamp": "2025-05-21T14:30:00Z",
    "Status": "Negotiating",
    "QuotedCostPrice": 1850
  },
  {
    "QuoteToBuyerID": 13,
    "SupplierQuoteID": 1,
    "ProductID": 1,
    "BuyerID": 102,
    "QuotedPrice": 2320,
    "CustomerExpectedPrice": 2300,
    "BID": 2300,
    "QuoteTimestamp": "2025-05-22T09:00:00Z",
    "Status": "Negotiating",
    "QuotedCostPrice": 1850
  } ],
         Orders: [{ OrderID: 10, OrderNumber: "ORD-202506-010", BuyerID: 101, SystemCreatedAt: "2025-06-03T10:00:00Z" }],
         Order_Line_Items: [{ LineItemID: 10, OrderID: 10, QuoteToBuyerID: 10 }]
    };

    // --- 共用輔助函式 ---
    const findById = (collectionName, id, keyName) => db[collectionName].find(item => item[keyName] === id);
    const highlightCurrentNav = () => { let currentPage = 'products'; const activeLink = document.querySelector(`a[data-page="${currentPage}"]`); if (activeLink) { activeLink.classList.add('bg-indigo-50', 'text-indigo-600', 'font-bold', 'border-l-4', 'border-indigo-600'); } };
    const formatDateTime = (iso) => iso ? new Date(iso).toLocaleString('zh-TW', { timeZone: "Asia/Taipei", year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).replace(/,/g, '') : 'N/A';

    // --- Modal Functions ---
    const modalContainer = document.getElementById('modal-container');
    function showModal(title, content) { modalContainer.innerHTML = `<div class="bg-white rounded-lg shadow-xl w-full max-w-lg m-auto"><div class="flex justify-between items-center p-5 border-b"><h3 class="text-xl font-bold">${title}</h3><button data-action="close-modal" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button></div><div class="p-6">${content}</div><div class="flex justify-end p-4 bg-gray-50 border-t"><button data-action="close-modal" class="bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-lg mr-2 hover:bg-gray-300">取消</button><button data-action="close-modal" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700">儲存 (展示)</button></div></div>`; modalContainer.classList.remove('hidden'); document.body.classList.add('modal-open'); }
    function closeModal() { if(modalContainer) { modalContainer.classList.add('hidden'); document.body.classList.remove('modal-open'); } }
    function getModalContent(type) {
        const inputClass = "mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"; const labelClass = "block text-sm font-medium text-gray-700"; const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset()); const nowString = now.toISOString().slice(0,16);
        switch(type) {
            case 'add-cost': return `<div class="space-y-4"><div><label class="${labelClass}">供應商報價</label><input type="number" class="${inputClass}"></div><div><label class="${labelClass}">業務報價</label><input type="number" class="${inputClass}"></div><div><label class="${labelClass}">出價時間</label><input type="datetime-local" value="${nowString}" class="${inputClass}"></div></div>`;
            case 'add-quote': const buyerOptions = db.Buyers.map(b => `<option value="${b.BuyerID}">${b.BuyerName}</option>`).join(''); return `<div class="space-y-4"><div><label class="${labelClass}">選擇購買者</label><select class="${inputClass}">${buyerOptions}</select></div><div><label class="${labelClass}">當次業務報價</label><input type="number" class="${inputClass}"></div><div><label class="${labelClass}">購買者出價 BID</label><input type="number" class="${inputClass}"></div><div><label class="${labelClass}">購買者預期價格</label><input type="number" class="${inputClass}"></div></div>`;
            case 'pre-close': return `<div class="space-y-4"><div><label class="${labelClass}">最終成交價(賣)</label><input type="number" class="${inputClass}"></div><div><label class="${labelClass}">最終成交價(買)</label><input type="number" class="${inputClass}"></div><div><label class="${labelClass}">交易時間</label><input type="datetime-local" value="${nowString}" class="${inputClass}"></div></div>`;
            default: return '';
        }
    }

    // --- Page & Tab Renderers ---
    function renderPage(productId) {
        const pageContent = document.getElementById('page-content');
        const product = findById('Products', productId, 'ProductID');
        if (!product) { pageContent.innerHTML = `<div class="text-center text-red-500 font-bold">錯誤：找不到 ID 為 ${productId} 的產品。</div>`; return; }
        const allSupplierQuotes = db.Supplier_Quotes.filter(sq => sq.ProductID === product.ProductID).sort((a,b) => new Date(b.EffectiveTimestamp) - new Date(a.EffectiveTimestamp));
        pageContent.innerHTML = `<div class="fade-in">${renderBasicInfo(product)}${renderQuotesToBuyers(product, allSupplierQuotes)}${renderInternalCosts(allSupplierQuotes)}</div>`;
    }

    function renderBasicInfo(product) {
        const supplier = findById('Suppliers', product.SupplierID, 'SupplierID'); const category = findById('Product_Categories', product.CategoryID, 'CategoryID'); const part = findById('Product_Parts', product.PartID, 'PartID'); const spec = findById('Product_Specs', product.SpecID, 'SpecID'); const packaging = findById('Product_Packagings', product.PackagingID, 'PackagingID'); const area = findById('Production_Areas', product.AreaID, 'AreaID'); const prodNum = findById('Supplier_Production_Numbers', product.ProdNumID, 'ProdNumID'); const brand = findById('Sub_Brands', product.SubBrandID, 'SubBrandID');
        return `<div class="mb-6 bg-white p-6 rounded-lg shadow"><div class="flex justify-between items-start"><div><h2 class="text-3xl font-bold text-gray-900">${product.ProductDisplayName}</h2><p class="text-gray-500 mt-1">產品代碼: <span class="font-mono">${product.ProductCode}</span></p></div><button class="text-gray-500 hover:text-gray-800 font-semibold text-sm">編輯基本資料</button></div><div class="mt-4 pt-4 border-t grid grid-cols-2 md:grid-cols-4 gap-4 text-sm"><div><strong class="block text-gray-500">供應商</strong> ${supplier?.SupplierName||'N/A'}</div><div><strong class="block text-gray-500">產地</strong> ${area?.AreaName||'N/A'}</div><div><strong class="block text-gray-500">產號</strong> ${prodNum?.ProductionNumber||'N/A'}</div><div><strong class="block text-gray-500">品牌</strong> ${brand?.SubBrandName||'N/A'}</div><div><strong class="block text-gray-500">種類</strong> ${category?.PartName_ZH||'N/A'}</div><div><strong class="block text-gray-500">部位</strong> ${part?.PartName_ZH||'N/A'}</div><div><strong class="block text-gray-500">規格</strong> ${spec?.SpecName_ZH||'N/A'}</div><div><strong class="block text-gray-500">包裝</strong> ${packaging?.PackagingName_ZH||'N/A'}</div></div></div>`;
    }

    function renderInternalCosts(allSupplierQuotes) {
        return `<div class="bg-white p-6 rounded-lg shadow-md mt-8"><div class="flex justify-between items-center border-b pb-3 mb-4"><h3 class="text-xl font-bold text-gray-800">供應商報價 (內部成本) 區</h3><button data-action="show-add-cost-modal" class="bg-orange-500 text-white text-sm font-bold py-2 px-3 rounded-lg hover:bg-orange-600">新增成本</button></div><div class="overflow-x-auto"><table class="min-w-full text-sm"><thead class="bg-gray-100"><tr><th class="p-3 text-left font-semibold text-gray-600">出價時間</th><th class="p-3 text-left font-semibold text-gray-600">供應商報價</th><th class="p-3 text-left font-semibold text-gray-600">業務報價</th></tr></thead><tbody class="divide-y divide-gray-200">${allSupplierQuotes.map(sq => `<tr><td class="p-3">${formatDateTime(sq.EffectiveTimestamp)}</td><td class="p-3">$${sq.SupplierOriginalPrice.toLocaleString()}</td><td class="p-3 text-red-600 font-semibold">$${sq.InternalCostPrice.toLocaleString()}</td></tr>`).join('')}</tbody></table></div></div>`;
    }

    // *** MODIFIED FUNCTION ***
    function renderQuotesToBuyers(product, allSupplierQuotes) {
        const latestSupplierQuote = allSupplierQuotes[0] || null;
        const historicalQuotes = allSupplierQuotes.slice(1);
        const orderedQuoteIds = new Set(db.Order_Line_Items.map(item => item.QuoteToBuyerID));

        const renderNegotiationTable = (quotes, isLatestPeriod) => { // Added isLatestPeriod flag
            if (quotes.length === 0) return `<p class="text-sm text-gray-500 px-3 py-4">此時段無對外報價紀錄。</p>`;
            const latestQuotesByBuyer = new Map();
            quotes.forEach(q => { const existing = latestQuotesByBuyer.get(q.BuyerID); if (!existing || new Date(q.QuoteTimestamp) > new Date(existing.QuoteTimestamp)) { latestQuotesByBuyer.set(q.BuyerID, q); } });
            const latestQuoteIds = new Set([...latestQuotesByBuyer.values()].map(q => q.QuoteToBuyerID));

            return `<table class="min-w-full text-sm"><thead class="bg-gray-100"><tr><th class="p-2 text-left">購買者</th><th class="p-2 text-left">當次業務報價</th><th class="p-2 text-left">購買者出價 BID</th><th class="p-2 text-left">購買者預期價格</th><th class="p-2 text-left">報價時間</th><th class="p-2 text-left">操作 / 成交資訊</th></tr></thead>
                <tbody class="divide-y divide-gray-200">${quotes.map(q => {
                    const isLatestForThisBuyer = latestQuoteIds.has(q.QuoteToBuyerID);
                    const isOrdered = orderedQuoteIds.has(q.QuoteToBuyerID);
                    let actionOrInfoHtml = '';

                    if (isOrdered) {
                        const lineItem = db.Order_Line_Items.find(li => li.QuoteToBuyerID === q.QuoteToBuyerID);
                        const order = findById('Orders', lineItem?.OrderID, 'OrderID');
                        actionOrInfoHtml = `<div class="text-xs text-blue-600">訂單: <a href="./order-detail.html?id=${order?.OrderID}" class="underline hover:text-blue-800">${order?.OrderNumber}</a><br>成交價(賣): $${q.FinalSellingPrice}<br>成交價(買): $${q.FinalCostPrice}<br>時間: ${formatDateTime(order?.SystemCreatedAt)}</div>`;
                    } else if (isLatestForThisBuyer && isLatestPeriod) { // Button only appears if it's the latest period
                        actionOrInfoHtml = `<button data-action="show-pre-close-modal" class="bg-teal-500 text-white text-xs font-bold py-1 px-2 rounded hover:bg-teal-600">預定成交</button>`;
                    }
                    return `<tr><td class="p-2">${findById('Buyers', q.BuyerID, 'BuyerID')?.BuyerName}</td><td class="p-2">$${q.QuotedPrice || '-'}</td><td class="p-2">$${q.BID || '-'}</td><td class="p-2">$${q.CustomerExpectedPrice || '-'}</td><td class="p-2">${formatDateTime(q.QuoteTimestamp)}</td><td class="p-2">${actionOrInfoHtml || '-'}</td></tr>`
                }).join('')}</tbody>
            </table>`;
        };
        const quotesForLatestPeriod = latestSupplierQuote ? db.Quotes_To_Buyers.filter(qtb => qtb.SupplierQuoteID === latestSupplierQuote.SupplierQuoteID) : [];
        return `<div class="bg-white p-6 rounded-lg shadow-md mt-8"><div class="flex justify-between items-center border-b pb-3 mb-4"><h3 class="text-xl font-bold text-gray-800">對購買者報價區</h3><button data-action="show-add-quote-modal" class="bg-green-500 text-white text-sm font-bold py-2 px-3 rounded-lg hover:bg-green-600">新增對外報價</button></div>
            <div class="border-2 border-indigo-200 rounded-lg p-4"><h4 class="text-lg font-bold text-indigo-700">主要顯示區：最新時段</h4>${latestSupplierQuote ? `<div class="bg-indigo-50 p-3 rounded-lg my-4"><h5 class="font-semibold text-sm">供應商報價資訊 (於 ${formatDateTime(latestSupplierQuote.EffectiveTimestamp)})</h5><div class="flex gap-8 mt-1"><div><span class="text-xs">業務報價:</span> <strong class="text-red-600">$${latestSupplierQuote.InternalCostPrice}</strong></div><div><span class="text-xs">供應商報價:</span> <strong>$${latestSupplierQuote.SupplierOriginalPrice}</strong></div></div></div><div class="overflow-x-auto">${renderNegotiationTable(quotesForLatestPeriod, true)}</div>` : `<p class="text-gray-500 py-4">此產品尚無供應商報價。</p>`}</div>
            <div class="mt-6"><h4 class="text-lg font-bold text-gray-700 mb-2">歷史時段列表</h4><div class="space-y-2">${historicalQuotes.map(sq => `<details class="bg-gray-50 rounded-lg border hover:bg-gray-100 transition"><summary class="p-4 font-semibold cursor-pointer flex justify-between text-sm"><span>報價時段: ${formatDateTime(sq.EffectiveTimestamp)}</span><span>業務報價: <strong class="text-red-600">$${sq.InternalCostPrice}</strong> / 供應商報價: $${sq.SupplierOriginalPrice}</span></summary><div class="p-4 border-t bg-white overflow-x-auto">${renderNegotiationTable(db.Quotes_To_Buyers.filter(qtb => qtb.SupplierQuoteID === sq.SupplierQuoteID), false)}</div></details>`).join('')}</div></div>
        </div>`;
    }

    // --- Event Handlers & Initial Load ---
    function handlePageEvents() {
        const pageContent = document.getElementById('page-content');
        pageContent.addEventListener('click', (e) => {
            const target = e.target.closest('[data-action]'); if (!target) return;
            const { action } = target.dataset;
            if (action === 'show-add-cost-modal') { showModal('新增成本', getModalContent('add-cost')); }
            else if (action === 'show-add-quote-modal') { showModal('新增對外報價', getModalContent('add-quote')); }
            else if (action === 'show-pre-close-modal') { showModal('預定成交', getModalContent('pre-close')); }
        });
        modalContainer.addEventListener('click', (e) => { if (e.target.id === 'modal-container' || e.target.closest('[data-action="close-modal"]')) { closeModal(); } });
    }
    document.addEventListener('DOMContentLoaded', () => {
        highlightCurrentNav();
        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id'));
        if (productId) { renderPage(productId); handlePageEvents(); }
        else { document.getElementById('page-content').innerHTML = `<div class="text-center text-red-500 font-bold">錯誤：URL 中缺少產品 ID。</div>`; }
    });

</script>
</body>
</html>
