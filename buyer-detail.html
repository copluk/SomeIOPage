<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購買者詳情 - 內部貿易系統</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .slide-in-left { animation: slideInLeft 0.4s ease-in-out; }
        @keyframes slideInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details > summary::before { content: '\f0da'; font-family: 'Font Awesome 6 Free'; font-weight: 900; margin-right: 0.5rem; transition: transform 0.2s ease-in-out; display: inline-block; }
        details[open] > summary::before { transform: rotate(90deg); }

        button:disabled { cursor: not-allowed; background-color: #d1d5db; }
        button:disabled:hover { background-color: #d1d5db; }
        body.modal-open { overflow: hidden; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

<div id="app" class="flex h-screen">

    <nav class="w-64 bg-white shadow-lg flex-shrink-0 flex flex-col">
        <a href="./products.html" class="p-4 border-b flex items-center gap-3 hover:bg-gray-50 transition-colors">
            <i class="fas fa-chart-line text-3xl text-indigo-600"></i>
            <h1 class="text-xl font-bold text-gray-800">內部貿易系統</h1>
        </a>
        <ul class="flex-grow">
            <li><a href="./suppliers.html" data-page="suppliers" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-truck w-5 text-center"></i><span>供應商管理</span></a></li>
            <li><a href="./buyers.html" data-page="buyers" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-users w-5 text-center"></i><span>購買者管理</span></a></li>
            <li><a href="./products.html" data-page="products" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-box-open w-5 text-center"></i><span>產品管理</span></a></li>
            <li><a href="./attributes.html" data-page="attributes" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-tags w-5 text-center"></i><span>產品屬性管理</span></a></li>
            <li><a href="./orders.html" data-page="orders" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-file-invoice-dollar w-5 text-center"></i><span>訂單管理</span></a></li>
            <li>
                <a href="./orderFinance.html" data-page="orderFinance" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200">
                    <i class="fas fa-chart-pie w-5 text-center"></i>
                    <span>訂單利潤</span>
                </a>
            </li>
            <li><a href="./quote-inquiry.html" data-page="quote-inquiry" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-search-dollar w-5 text-center"></i><span>綜合報價查詢</span></a></li>
        </ul>
    </nav>

    <main id="page-content" class="flex-1 p-6 md:p-8 overflow-y-auto bg-gray-50">
        <div class="text-center text-gray-500">正在載入資料...</div>
    </main>
</div>

<div id="modal-container" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 p-4 fade-in"></div>

<script>
    // --- 資料模型 (Data Model) ---
    const db = {
         Users: [ { UserID: 1, FullName: "林業務" }, { UserID: 2, FullName: "陳經理" } ],
         Buyers: [ { BuyerID: 101, BuyerName: "A級牛排館", AssignedSalespersonUserID: 1, ContactPersonName: "陳主廚", ContactPersonEmail: "chen.chef@asteak.com", ContactPersonPhone: "0912-345-678", PaymentTerms: "月結60天", Remarks: "偏好油花較少的部位。" }, { BuyerID: 102, BuyerName: "饗食天堂餐飲集團", AssignedSalespersonUserID: 2, ContactPersonName: "採購部林先生", ContactPersonEmail: "procurement.lin@eat-together.com", ContactPersonPhone: "02-8780-8000", PaymentTerms: "月結45天", Remarks: "集團統一採購，需附檢驗報告。" } ],
         Products: [{ ProductID: 1, SupplierID: 1, ProductDisplayName: "澳洲和牛M9肋眼" }, { ProductID: 2, SupplierID: 1, ProductDisplayName: "西班牙伊比利豬梅花" }, { ProductID: 3, SupplierID: 1, ProductDisplayName: "台灣活菌豬五花" }, { ProductID: 4, SupplierID: 2, ProductDisplayName: "波士頓龍蝦" }],
         Suppliers: [{ SupplierID: 1, SupplierName: "環球肉品公司" }, { SupplierID: 2, SupplierName: "頂級海鮮直送" }],
         Supplier_Quotes: [{ SupplierQuoteID: 3, ProductID: 1, EffectiveTimestamp: "2025-06-10T00:00:00Z", SupplierOriginalPrice: 1810, InternalCostPrice: 1860 }, { SupplierQuoteID: 2, ProductID: 1, EffectiveTimestamp: "2025-06-01T00:00:00Z", SupplierOriginalPrice: 1820, InternalCostPrice: 1870 }, { SupplierQuoteID: 6, ProductID: 2, EffectiveTimestamp: "2025-06-08T00:00:00Z", SupplierOriginalPrice: 805, InternalCostPrice: 855 }, { SupplierQuoteID: 9, ProductID: 3, EffectiveTimestamp: "2025-06-09T00:00:00Z", SupplierOriginalPrice: 405, InternalCostPrice: 435 }, { SupplierQuoteID: 12, ProductID: 4, EffectiveTimestamp: "2025-06-11T00:00:00Z", SupplierOriginalPrice: 1180, InternalCostPrice: 1230 }],
         Quotes_To_Buyers: [{ QuoteToBuyerID: 1, SupplierQuoteID: 3, ProductID: 1, BuyerID: 101, QuotedPrice: 2200, CustomerExpectedPrice: null, BID: null, QuoteTimestamp: "2025-06-11T10:00:00Z", Status: "Negotiating" }, { QuoteToBuyerID: 2, SupplierQuoteID: 3, ProductID: 1, BuyerID: 101, QuotedPrice: 2180, CustomerExpectedPrice: 2150, BID: 2160, QuoteTimestamp: "2025-06-11T11:00:00Z", Status: "Negotiating" }, { QuoteToBuyerID: 3, SupplierQuoteID: 3, ProductID: 1, BuyerID: 102, QuotedPrice: 2250, CustomerExpectedPrice: null, BID: null, QuoteTimestamp: "2025-06-12T09:30:00Z", Status: "Negotiating" }, { QuoteToBuyerID: 4, SupplierQuoteID: 6, ProductID: 2, BuyerID: 101, QuotedPrice: 1000, CustomerExpectedPrice: 980, BID: 980, QuoteTimestamp: "2025-06-09T14:00:00Z", Status: "Accepted" }, { QuoteToBuyerID: 5, SupplierQuoteID: 9, ProductID: 3, BuyerID: 101, QuotedPrice: 550, CustomerExpectedPrice: 550, BID: 550, QuoteTimestamp: "2025-06-10T11:00:00Z", Status: "Accepted" }, { QuoteToBuyerID: 6, SupplierQuoteID: 12, ProductID: 4, BuyerID: 101, QuotedPrice: 1400, CustomerExpectedPrice: 1400, BID: 1400, QuoteTimestamp: "2025-06-12T15:00:00Z", Status: "Accepted" }, { QuoteToBuyerID: 9, SupplierQuoteID: 12, ProductID: 4, BuyerID: 102, QuotedPrice: 1350, CustomerExpectedPrice: 1350, BID: 1350, QuoteTimestamp: "2025-06-14T10:00:00Z", Status: "Accepted" }, { QuoteToBuyerID: 10, SupplierQuoteID: 2, ProductID: 1, BuyerID: 101, QuotedPrice: 2280, CustomerExpectedPrice: 2260, BID: 2260, QuoteTimestamp: "2025-06-02T11:00:00Z", Status: "Ordered", FinalSellingPrice: 2260, FinalCostPrice: 1870 }],
         Orders: [{ OrderID: 10, OrderNumber: "ORD-202506-010", BuyerID: 101, SystemCreatedAt: "2025-06-03T10:00:00Z" }],
         Order_Line_Items: [{ LineItemID: 10, OrderID: 10, QuoteToBuyerID: 10 }]
    };

    // --- 共用輔助函式 ---
    const formatDateTime = (iso) => iso ? new Date(iso).toLocaleString('zh-TW', { timeZone: "Asia/Taipei", year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).replace(/,/g, '') : 'N/A';
    const findById = (collectionName, id, keyName) => db[collectionName].find(item => item[keyName] === id);
    const highlightCurrentNav = () => { const currentPage = 'buyers'; const activeLink = document.querySelector(`a[data-page="${currentPage}"]`); if (activeLink) { activeLink.classList.add('bg-indigo-50', 'text-indigo-600', 'font-bold', 'border-l-4', 'border-indigo-600'); } };

    // --- buyer-detail.html 頁面專屬邏輯 ---
    const pageState = { activeTab: 'quote', selectedProductId: null, selectedSupplierIdForOrder: null, checkedQuoteIds: new Set() };

    // --- Modal Functions ---
    const modalContainer = document.getElementById('modal-container');
    function showModal(title, content) { modalContainer.innerHTML = `<div class="bg-white rounded-lg shadow-xl w-full max-w-lg m-auto"><div class="flex justify-between items-center p-5 border-b"><h3 class="text-xl font-bold">${title}</h3><button data-action="close-modal" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button></div><div class="p-6">${content}</div><div class="flex justify-end p-4 bg-gray-50 border-t"><button data-action="close-modal" class="bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-lg mr-2 hover:bg-gray-300">取消</button><button data-action="close-modal" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700">儲存 (展示)</button></div></div>`; modalContainer.classList.remove('hidden'); document.body.classList.add('modal-open'); }
    function closeModal() { if(modalContainer) { modalContainer.classList.add('hidden'); document.body.classList.remove('modal-open'); } }
    function getModalContent(type) {
        const inputClass = "mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"; const labelClass = "block text-sm font-medium text-gray-700"; const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset()); const nowString = now.toISOString().slice(0,16);
        if (type === 'pre-close') { return `<div class="space-y-4"><div><label class="${labelClass}">最終成交價(賣)</label><input type="number" class="${inputClass}"></div><div><label class="${labelClass}">最終成交價(買)</label><input type="number" class="${inputClass}"></div><div><label class="${labelClass}">交易時間</label><input type="datetime-local" value="${nowString}" class="${inputClass}"></div></div>`; }
        if (type === 'add-quote') { return `<div class="space-y-4"><div><label class="${labelClass}">當次業務報價</label><input type="number" class="${inputClass}"></div><div><label class="${labelClass}">購買者出價 BID</label><input type="number" class="${inputClass}"></div><div><label class="${labelClass}">客戶預期價格</label><input type="number" class="${inputClass}"></div><div><label class="${labelClass}">報價時間</label><input type="datetime-local" value="${nowString}" class="${inputClass}"></div></div>`; }
        return '';
    }

    // --- Page & Tab Renderers ---
    function renderPage(buyerId) {
        const pageContent = document.getElementById('page-content');
        const buyer = findById('Buyers', buyerId, 'BuyerID');
        if (!buyer) { pageContent.innerHTML = `<div class="text-center text-red-500 font-bold">錯誤：找不到 ID 為 ${buyerId} 的購買者。</div>`; return; }
        const tabs = [{ key: 'quote', name: '報價與議價' }, { key: 'pendingOrders', name: '予定成交訂單' }, { key: 'history', name: '歷史出價列表' }];
        pageContent.innerHTML = `<div class="fade-in"><div class="mb-6 bg-white p-6 rounded-lg shadow"><div class="flex justify-between items-start"><div><h2 class="text-3xl font-bold text-gray-900">${buyer.BuyerName}</h2><p class="text-gray-500 mt-1">負責業務: ${findById('Users', buyer.AssignedSalespersonUserID, 'UserID')?.FullName}</p></div></div></div><div class="border-b border-gray-200"><nav id="tab-nav" class="-mb-px flex space-x-8">${tabs.map(t => `<button data-action="switch-tab" data-tab="${t.key}" class="py-4 px-1 border-b-2 font-medium text-sm ${pageState.activeTab === t.key ? 'border-indigo-500 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}">${t.name}</button>`).join('')}</nav></div><div id="tab-content" class="mt-6">${renderTabContent(buyer)}</div></div>`;
    }

    function renderTabContent(buyer) {
        switch (pageState.activeTab) {
            case 'quote': return renderQuoteTimelineTab(buyer);
            case 'pendingOrders': return renderPendingOrdersTab(buyer);
            case 'history': return renderHistoryTab(buyer);
        }
    }

    function renderQuoteTimelineTab(buyer) {
        const productIds = [...new Set(db.Quotes_To_Buyers.filter(q => q.BuyerID === buyer.BuyerID).map(q => q.ProductID))];
        const products = db.Products.filter(p => productIds.includes(p.ProductID));
        let rightPanelHtml = `<div class="text-center text-gray-500 h-full flex items-center justify-center p-8">請從左側選擇一個產品查看議價時間軸。</div>`;
        if (pageState.selectedProductId) {
            const selectedProduct = findById('Products', pageState.selectedProductId, 'ProductID');
            const allQuotesForProduct = db.Quotes_To_Buyers.filter(q => q.ProductID === selectedProduct.ProductID && q.BuyerID === buyer.BuyerID);
            const supplierQuoteIds = [...new Set(allQuotesForProduct.map(q => q.SupplierQuoteID))];
            const negotiationRounds = supplierQuoteIds.map(sqId => findById('Supplier_Quotes', sqId, 'SupplierQuoteID')).sort((a,b) => new Date(b.EffectiveTimestamp) - new Date(a.EffectiveTimestamp));
            rightPanelHtml = `<div class="space-y-6">`;
            negotiationRounds.forEach((sq, index) => {
                const quotesForThisRound = allQuotesForProduct.filter(q => q.SupplierQuoteID === sq.SupplierQuoteID).sort((a,b) => new Date(b.QuoteTimestamp) - new Date(a.QuoteTimestamp));
                const latestQuoteInRound = quotesForThisRound[0];
                const isOrdered = latestQuoteInRound && db.Order_Line_Items.some(li => li.QuoteToBuyerID === latestQuoteInRound.QuoteToBuyerID);
                const canBePreClosed = index === 0 && latestQuoteInRound && !isOrdered;
                const actionButtonHtml = canBePreClosed ? `<button data-action="show-pre-close-modal" class="bg-teal-500 text-white text-xs font-bold py-1 px-2 rounded hover:bg-teal-600">預定成交</button>` : '';

                let orderInfoHtml = '';
                if(isOrdered) {
                    const lineItem = db.Order_Line_Items.find(li => li.QuoteToBuyerID === latestQuoteInRound.QuoteToBuyerID);
                    const order = findById('Orders', lineItem.OrderID, 'OrderID');
                    orderInfoHtml = `<div class="mt-2 text-right text-sm font-bold text-green-600 p-2 bg-green-50 rounded-md">
                        <i class="fas fa-check-circle mr-1"></i> 已成交 (訂單: <a href="./order-detail.html?id=${order.OrderID}" class="underline">${order.OrderNumber}</a>, 最終成交價(賣): $${latestQuoteInRound.FinalSellingPrice} / 買: $${latestQuoteInRound.FinalCostPrice})
                    </div>`;
                }

                rightPanelHtml += `<div class="bg-white p-4 rounded-lg shadow-md border ${index === 0 ? 'border-indigo-300' : 'border-gray-200'}"><div class="flex justify-between items-baseline mb-3"><h4 class="font-bold text-lg ${index === 0 ? 'text-indigo-700' : 'text-gray-800'}">${index === 0 ? '當前議價回合' : '歷史議價回合'}</h4>${index === 0 ? `<button data-action="show-add-quote-modal" class="bg-blue-500 text-white text-xs font-bold py-1 px-3 rounded-md hover:bg-blue-600">新增報價</button>` : ''}</div><p class="text-sm text-gray-500 mb-3">成本生效時段: ${formatDateTime(sq.EffectiveTimestamp)}</p><div class="bg-gray-50 p-3 rounded-md mb-3 text-sm"><span class="mr-4"><strong>業務報價:</strong> <span class="text-red-600 font-semibold">$${sq.InternalCostPrice}</span></span><span><strong>供應商報價:</strong> $${sq.SupplierOriginalPrice}</span></div><table class="min-w-full text-xs"><thead class="bg-gray-100"><tr><th class="p-2 text-left">當次業務報價</th><th class="p-2 text-left">購買者出價(BID)</th><th class="p-2 text-left">客戶預期價格</th><th class="p-2 text-left">時間</th><th class="p-2 text-left">操作</th></tr></thead><tbody class="divide-y divide-gray-200">${quotesForThisRound.map((q, qIndex) => `<tr><td class="p-2">$${q.QuotedPrice || '-'}</td><td class="p-2">$${q.BID || '-'}</td><td class="p-2">$${q.CustomerExpectedPrice || '-'}</td><td class="p-2">${formatDateTime(q.QuoteTimestamp)}</td><td class="p-2">${(qIndex === 0) ? actionButtonHtml : ''}</td></tr>`).join('')}</tbody></table>${orderInfoHtml}</div>`;
            });
            rightPanelHtml += `</div>`;
        }
        return `<div class="grid grid-cols-1 md:grid-cols-3 gap-6"><div id="product-list-panel" class="md:col-span-1 bg-white p-4 rounded-lg shadow-sm h-fit"><h3 class="font-bold border-b pb-2 mb-2 text-gray-700">此購買者曾議價過的產品</h3><ul class="space-y-1">${products.map(p => `<li data-action="select-product" data-id="${p.ProductID}" class="p-2 rounded cursor-pointer ${p.ProductID === pageState.selectedProductId ? 'bg-indigo-100 font-bold text-indigo-700' : 'hover:bg-gray-100'}">${p.ProductDisplayName}</li>`).join('')}</ul></div><div class="md:col-span-2 slide-in-left">${rightPanelHtml}</div></div>`;
    }

    function renderPendingOrdersTab(buyer) {
        const acceptedQuotes = db.Quotes_To_Buyers.filter(q => q.BuyerID === buyer.BuyerID && q.Status === 'Accepted');
        const tableRowsHtml = acceptedQuotes.map(q => { const product = findById('Products', q.ProductID, 'ProductID'); const supplier = findById('Suppliers', product.SupplierID, 'SupplierID'); const sq = findById('Supplier_Quotes', q.SupplierQuoteID, 'SupplierQuoteID'); const isEnabled = !pageState.selectedSupplierIdForOrder || pageState.selectedSupplierIdForOrder === product.SupplierID; const isChecked = pageState.checkedQuoteIds.has(q.QuoteToBuyerID); return `<tr class="${isEnabled ? 'hover:bg-gray-50' : 'opacity-50 bg-gray-100 text-gray-400'}"><td class="p-3"><input type="checkbox" data-action="toggle-order-item" data-supplier-id="${product.SupplierID}" data-quote-id="${q.QuoteToBuyerID}" ${isEnabled ? '' : 'disabled'} ${isChecked ? 'checked' : ''}></td><td class="p-3">${product?.ProductDisplayName || 'N/A'}</td><td class="p-3">${supplier?.SupplierName || 'N/A'}</td><td class="p-3">$${sq?.SupplierOriginalPrice || '-'}</td><td class="p-3">$${q.QuotedPrice || '-'}</td><td class="p-3">$${q.BID || '-'}</td><td class="p-3">$${q.CustomerExpectedPrice || '-'}</td><td class="p-3 text-red-600 font-medium">$${q.FinalCostPrice || sq?.InternalCostPrice || '-'}</td><td class="p-3 font-bold">$${q.FinalSellingPrice || q.CustomerExpectedPrice || q.QuotedPrice}</td><td class="p-3">${formatDateTime(q.QuoteTimestamp)}</td><td class="p-3"><input type="number" class="w-20 p-1 border rounded-md" ${isEnabled ? '' : 'disabled'}></td></tr>`}).join('');
        return `<div class="bg-white p-6 rounded-lg shadow-md"><h3 class="text-xl font-bold text-gray-800 mb-2">第一步：勾選已接受的報價</h3><p class="text-sm text-gray-500 mb-4">請勾選來自<strong class="text-indigo-600">同一個供應商</strong>的產品，以合併為訂單。</p>${acceptedQuotes.length > 0 ? `<div class="overflow-x-auto border rounded-lg"><table class="min-w-full text-sm"><thead class="bg-gray-100"><tr><th class="p-3 text-left w-10"><input type="checkbox" disabled></th><th class="p-3 text-left">產品名稱</th><th class="p-3 text-left">供應商</th><th class="p-3 text-left">供應商報價</th><th class="p-3 text-left">當次業務報價</th><th class="p-3 text-left">購買者出價(BID)</th><th class="p-3 text-left">購買者預期售價</th><th class="p-3 text-left">最終成交價(買)</th><th class="p-3 text-left">最終成交價(賣)</th><th class="p-3 text-left">報價時間</th><th class="p-3 text-left">重量(kg)</th></tr></thead><tbody id="pending-order-tbody" class="divide-y divide-gray-200">${tableRowsHtml}</tbody></table></div>` : `<p class="text-gray-500 text-center py-8">目前沒有已接受的報價。</p>`}<div class="mt-8 pt-6 border-t"><h3 class="text-xl font-bold text-gray-800 mb-4">第二步：填寫訂單共用資訊</h3><div class="grid grid-cols-1 md:grid-cols-4 gap-6"><div><label for="loading-time" class="block text-sm font-medium text-gray-700">裝櫃時間</label><input type="datetime-local" id="loading-time" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"></div><div><label for="eta-time" class="block text-sm font-medium text-gray-700">預計到貨時間</label><input type="datetime-local" id="eta-time" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"></div><div><label for="payment-method" class="block text-sm font-medium text-gray-700">支付方式</label><input type="text" id="payment-method" value="${buyer.PaymentTerms}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"></div><div><label for="order-number" class="block text-sm font-medium text-gray-700">訂單編號</label><input type="text" id="order-number" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"></div></div></div><div class="mt-8 pt-6 text-right"><button id="create-order-btn" class="bg-green-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-green-700 disabled:bg-gray-400" disabled>建立訂單 (展示)</button></div></div>`;
    }

    function renderHistoryTab(buyer) {
        const allQuotesForBuyer = db.Quotes_To_Buyers.filter(q => q.BuyerID === buyer.BuyerID);
        const productIdsHistory = [...new Set(allQuotesForBuyer.map(q => q.ProductID))];
        const productsHistory = db.Products.filter(p => productIdsHistory.includes(p.ProductID));
        return `<div class="bg-white p-6 rounded-lg shadow-md space-y-4"><h3 class="text-xl font-bold mb-2 text-gray-800">完整歷史出價列表</h3>${productsHistory.map(p => { const quotesForThisProduct = allQuotesForBuyer.filter(q => q.ProductID === p.ProductID).sort((a,b) => new Date(b.QuoteTimestamp) - new Date(a.QuoteTimestamp)); return `<details class="bg-gray-50 rounded-lg border hover:bg-gray-100 transition"><summary class="p-4 font-semibold cursor-pointer">${p.ProductDisplayName}</summary><div class="p-4 border-t bg-white overflow-x-auto"><table class="min-w-full text-sm"><thead class="bg-gray-100"><tr><th class="p-2 text-left">供應商報價時段</th><th class="p-2 text-left">當時供應商報價</th><th class="p-2 text-left">當時我方成本</th><th class="p-2 text-left">我方業務出價</th><th class="p-2 text-left">購買者出價(BID)</th><th class="p-2 text-left">客戶預期</th><th class="p-2 text-left">成交資訊</th></tr></thead><tbody class="divide-y divide-gray-200">${quotesForThisProduct.map(q => { const sq = findById('Supplier_Quotes', q.SupplierQuoteID, 'SupplierQuoteID'); const lineItem = db.Order_Line_Items.find(li => li.QuoteToBuyerID === q.QuoteToBuyerID); let orderInfo = '-'; if (lineItem) { const order = findById('Orders', lineItem.OrderID, 'OrderID'); orderInfo = `<div class="text-xs text-blue-600">訂單: ${order?.OrderNumber}<br>成交價(賣): $${q.FinalSellingPrice}<br>成交價(買): $${q.FinalCostPrice}<br>訂單時間: ${formatDateTime(order?.SystemCreatedAt)}</div>`; } return `<tr><td class="p-2">${formatDateTime(sq.EffectiveTimestamp)}</td><td class="p-2">$${sq.SupplierOriginalPrice}</td><td class="p-2 text-red-600">$${sq.InternalCostPrice}</td><td class="p-2">$${q.QuotedPrice || '-'}</td><td class="p-2">$${q.BID || '-'}</td><td class="p-2">$${q.CustomerExpectedPrice || '-'}</td><td class="p-2">${orderInfo}</td></tr>`}).join('')}</tbody></table></div></details>`}).join('')}</div>`;
    }

    // --- Event Handlers ---
    function updatePendingOrderView() { const tbody = document.getElementById('pending-order-tbody'); if (!tbody) return; const rows = tbody.querySelectorAll('tr'); rows.forEach(row => { const checkbox = row.querySelector('input[type="checkbox"]'); const otherInputs = row.querySelectorAll('input[type="number"]'); if (!checkbox) return; const supplierId = parseInt(checkbox.dataset.supplierId); const isEnabled = !pageState.selectedSupplierIdForOrder || pageState.selectedSupplierIdForOrder === supplierId; checkbox.disabled = !isEnabled; otherInputs.forEach(input => input.disabled = !isEnabled); if (isEnabled) { row.classList.remove('opacity-50', 'bg-gray-100', 'text-gray-400'); row.classList.add('hover:bg-gray-50'); } else { row.classList.add('opacity-50', 'bg-gray-100', 'text-gray-400'); row.classList.remove('hover:bg-gray-50'); } }); const createOrderBtn = document.getElementById('create-order-btn'); if (createOrderBtn) { createOrderBtn.disabled = !pageState.selectedSupplierIdForOrder; } }
    function handlePageEvents() {
        const pageContent = document.getElementById('page-content');
        pageContent.addEventListener('click', (e) => {
            const target = e.target.closest('[data-action]'); if (!target) return;
            const { action, tab, id } = target.dataset;
            const urlParams = new URLSearchParams(window.location.search); const buyerId = parseInt(urlParams.get('id'));
            if (action === 'switch-tab') { pageState.activeTab = tab; pageState.checkedQuoteIds.clear(); pageState.selectedSupplierIdForOrder = null; renderPage(buyerId); }
            else if (action === 'select-product') { pageState.selectedProductId = parseInt(id); renderPage(buyerId); }
            else if (action === 'show-pre-close-modal') { showModal('預定成交', getModalContent('pre-close')); }
            else if (action === 'show-add-quote-modal') { showModal('新增業務報價', getModalContent('add-quote')); }
        });
        pageContent.addEventListener('change', (e) => {
            const target = e.target.closest('[data-action="toggle-order-item"]');
            if (target) {
                const quoteId = parseInt(target.dataset.quoteId);
                if (target.checked) { pageState.checkedQuoteIds.add(quoteId); } else { pageState.checkedQuoteIds.delete(quoteId); }
                if (pageState.checkedQuoteIds.size > 0) { const firstCheckedQuote = db.Quotes_To_Buyers.find(q => q.QuoteToBuyerID === [...pageState.checkedQuoteIds][0]); const firstProduct = findById('Products', firstCheckedQuote.ProductID, 'ProductID'); pageState.selectedSupplierIdForOrder = firstProduct.SupplierID; }
                else { pageState.selectedSupplierIdForOrder = null; }
                updatePendingOrderView();
            }
        });
        modalContainer.addEventListener('click', (e) => { if (e.target.id === 'modal-container' || e.target.closest('[data-action="close-modal"]')) { closeModal(); } });
    }

    // --- Initial Load ---
    document.addEventListener('DOMContentLoaded', () => {
        highlightCurrentNav();
        const urlParams = new URLSearchParams(window.location.search);
        const buyerId = parseInt(urlParams.get('id')); const initialTab = urlParams.get('tab');
        if (initialTab) { pageState.activeTab = initialTab; }
        if (buyerId) { renderPage(buyerId); handlePageEvents(); }
        else { document.getElementById('page-content').innerHTML = `<div class="text-center text-red-500 font-bold">錯誤：URL 中缺少購買者 ID。</div>`; }
    });

</script>
</body>
