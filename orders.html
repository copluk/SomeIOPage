<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單管理 - 內部貿易系統</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

<div id="app" class="flex h-screen">

    <nav class="w-64 bg-white shadow-lg flex-shrink-0 flex flex-col">
        <a href="./products.html" class="p-4 border-b flex items-center gap-3 hover:bg-gray-50 transition-colors">
            <i class="fas fa-chart-line text-3xl text-indigo-600"></i>
            <h1 class="text-xl font-bold text-gray-800">內部貿易系統</h1>
        </a>
        <ul class="flex-grow">
            <li><a href="./suppliers.html" data-page="suppliers" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-truck w-5 text-center"></i><span>供應商管理</span></a></li>
            <li><a href="./buyers.html" data-page="buyers" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-users w-5 text-center"></i><span>購買者管理</span></a></li>
            <li><a href="./products.html" data-page="products" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-box-open w-5 text-center"></i><span>產品管理</span></a></li>
            <li><a href="./attributes.html" data-page="attributes" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-tags w-5 text-center"></i><span>產品屬性管理</span></a></li>
            <li><a href="./orders.html" data-page="orders" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-file-invoice-dollar w-5 text-center"></i><span>訂單管理</span></a></li>
            <li>
                <a href="./orderFinance.html" data-page="orderFinance" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200">
                    <i class="fas fa-chart-pie w-5 text-center"></i>
                    <span>訂單利潤</span>
                </a>
            </li>
            <li><a href="./quote-inquiry.html" data-page="quote-inquiry" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-search-dollar w-5 text-center"></i><span>綜合報價查詢</span></a></li>
        </ul>
    </nav>

    <main id="page-content" class="flex-1 p-6 md:p-8 overflow-y-auto bg-gray-50">
    </main>
</div>

<script>
    // --- 資料模型 (Data Model) ---
    const db = {
         Users: [ { UserID: 1, FullName: "林業務" }, { UserID: 2, FullName: "陳經理" } ],
         Suppliers: [ { SupplierID: 1, SupplierName: "環球肉品公司" }, { SupplierID: 2, SupplierName: "頂級海鮮直送" } ],
         Buyers: [ { BuyerID: 101, BuyerName: "A級牛排館" }, { BuyerID: 102, BuyerName: "饗食天堂餐飲集團" } ],
         Products: [{ ProductID: 1, SupplierID: 1, ProductDisplayName: "澳洲和牛M9肋眼" }, { ProductID: 2, SupplierID: 1, ProductDisplayName: "西班牙伊比利豬梅花" }, { ProductID: 3, SupplierID: 1, ProductDisplayName: "台灣活菌豬五花" }, { ProductID: 4, SupplierID: 2, ProductDisplayName: "波士頓龍蝦" }],
         Supplier_Quotes: [{ SupplierQuoteID: 2, ProductID: 1, SupplierOriginalPrice: 1820, InternalCostPrice: 1870 }, { SupplierQuoteID: 6, ProductID: 2, SupplierOriginalPrice: 805, InternalCostPrice: 855 }, { SupplierQuoteID: 9, ProductID: 3, SupplierOriginalPrice: 405, InternalCostPrice: 435 }, { SupplierQuoteID: 12, ProductID: 4, SupplierOriginalPrice: 1180, InternalCostPrice: 1230 }],
         Quotes_To_Buyers: [{ QuoteToBuyerID: 4, SupplierQuoteID: 6, ProductID: 2, BuyerID: 101, QuotedPrice: 1000, CustomerExpectedPrice: 980, BID: 980, QuoteTimestamp: "2025-06-09T14:00:00Z", Status: "Accepted", FinalSellingPrice: 990, FinalCostPrice: 855 }, { QuoteToBuyerID: 5, SupplierQuoteID: 9, ProductID: 3, BuyerID: 101, QuotedPrice: 550, CustomerExpectedPrice: 550, BID: 550, QuoteTimestamp: "2025-06-10T11:00:00Z", Status: "Accepted", FinalSellingPrice: 550, FinalCostPrice: 435 }, { QuoteToBuyerID: 6, SupplierQuoteID: 12, ProductID: 4, BuyerID: 101, QuotedPrice: 1400, CustomerExpectedPrice: 1400, BID: 1400, QuoteTimestamp: "2025-06-12T15:00:00Z", Status: "Accepted", FinalSellingPrice: 1400, FinalCostPrice: 1230 }, { QuoteToBuyerID: 9, SupplierQuoteID: 12, ProductID: 4, BuyerID: 102, QuotedPrice: 1350, CustomerExpectedPrice: 1350, BID: 1350, QuoteTimestamp: "2025-06-14T10:00:00Z", Status: "Accepted", FinalSellingPrice: 1350, FinalCostPrice: 1230 }, { QuoteToBuyerID: 10, SupplierQuoteID: 2, ProductID: 1, BuyerID: 101, QuotedPrice: 2280, CustomerExpectedPrice: 2260, BID: 2260, QuoteTimestamp: "2025-06-02T11:00:00Z", Status: "Ordered", FinalSellingPrice: 2260, FinalCostPrice: 1870 }],
         Orders: [{ OrderID: 10, OrderNumber: "ORD-202506-010", BuyerID: 101, SupplierID: 1, OrderStatus: "Confirmed", SystemCreatedAt: "2025-06-03T10:00:00Z" }],
         Order_Line_Items: [{ LineItemID: 10, OrderID: 10, QuoteToBuyerID: 10 }]
    };

    // --- 共用輔助函式 ---
    const formatDateTime = (iso) => iso ? new Date(iso).toLocaleString('zh-TW', { timeZone: "Asia/Taipei", year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).replace(/,/g, '') : 'N/A';
    const findById = (collectionName, id, keyName) => db[collectionName].find(item => item[keyName] === id);
    const getStatusBadge = (status) => { const styles = { Confirmed: 'bg-sky-100 text-sky-800' }; return `<span class="px-2 py-1 text-xs font-medium rounded-full whitespace-nowrap ${styles[status] || 'bg-gray-100 text-gray-800'}">${status}</span>`; };
    const highlightCurrentNav = () => { let currentPage = window.location.pathname.split('/').pop().replace('.html', ''); if (!currentPage || currentPage === 'index') { currentPage = 'products'; } const activeLink = document.querySelector(`a[data-page="${currentPage}"]`); if (activeLink) { activeLink.classList.add('bg-indigo-50', 'text-indigo-600', 'font-bold', 'border-l-4', 'border-indigo-600'); } };

    // --- orders.html 頁面專屬邏輯 ---
    const pageState = { activeTab: 'pending' };

    function renderPage() {
        const pageContent = document.getElementById('page-content');
        const tabs = [{ key: 'pending', name: '未處理訂單列表' }, { key: 'formal', name: '正式訂單列表' }];
        pageContent.innerHTML = `<div class="fade-in"><h2 class="text-3xl font-bold text-gray-900 mb-6">訂單管理</h2><div class="border-b border-gray-200"><nav class="-mb-px flex space-x-8" aria-label="Tabs">${tabs.map(t => `<button data-action="switch-tab" data-tab="${t.key}" class="py-4 px-1 border-b-2 font-medium text-sm ${pageState.activeTab === t.key ? 'border-indigo-500 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}">${t.name}</button>`).join('')}</nav></div><div id="tab-content-container" class="mt-6">${renderTabContent()}</div></div>`;
    }

    function renderTabContent() {
        switch (pageState.activeTab) {
            case 'pending': return renderPendingOrdersTab();
            case 'formal': return renderFormalOrdersTab();
        }
    }

    // *** MODIFIED FUNCTION with new columns ***
    function renderPendingOrdersTab() {
        const orderedQuoteIds = new Set(db.Order_Line_Items.map(item => item.QuoteToBuyerID));
        const pendingQuotes = db.Quotes_To_Buyers.filter(q => q.Status === 'Accepted' && !orderedQuoteIds.has(q.QuoteToBuyerID));
        return `
            <div class="bg-white shadow-lg rounded-lg overflow-hidden">
                 <div class="p-4 border-b"><p class="text-sm text-gray-600">集中顯示所有已談妥 (狀態為 Accepted) 但尚未建立正式訂單的報價項目，作為業務的待辦清單。</p></div>
                 <div class="overflow-x-auto">
                    <table class="min-w-full text-sm">
                        <thead class="bg-gray-100"><tr>
                            <th class="p-3 text-left font-semibold">購買者名稱</th><th class="p-3 text-left font-semibold">產品名稱</th><th class="p-3 text-left font-semibold">供應商</th>
                            <th class="p-3 text-left font-semibold">當次業務報價</th><th class="p-3 text-left font-semibold">購買者出價(BID)</th><th class="p-3 text-left font-semibold">客戶預期價格</th>
                            <th class="p-3 text-left font-semibold">最終成交價(買)</th><th class="p-3 text-left font-semibold">最終成交價(賣)</th>
                            <th class="p-3 text-left font-semibold">報價時間</th><th class="p-3 text-left font-semibold">操作</th>
                        </tr></thead>
                        <tbody class="divide-y divide-gray-200">
                        ${pendingQuotes.map(q => {
                            const buyer = findById('Buyers', q.BuyerID, 'BuyerID');
                            const product = findById('Products', q.ProductID, 'ProductID');
                            const supplier = findById('Suppliers', product?.SupplierID, 'SupplierID');
                            return `<tr class="hover:bg-gray-50">
                                <td class="p-3">${buyer?.BuyerName}</td><td class="p-3">${product?.ProductDisplayName}</td><td class="p-3">${supplier?.SupplierName}</td>
                                <td class="p-3">$${q.QuotedPrice?.toLocaleString() || '-'}</td><td class="p-3">$${q.BID?.toLocaleString() || '-'}</td><td class="p-3">$${q.CustomerExpectedPrice?.toLocaleString() || '-'}</td>
                                <td class="p-3 text-red-600 font-medium">$${q.FinalCostPrice?.toLocaleString() || '-'}</td><td class="p-3 font-bold">$${q.FinalSellingPrice?.toLocaleString() || '-'}</td>
                                <td class="p-3">${formatDateTime(q.QuoteTimestamp)}</td>
                                <td class="p-3"><a href="./buyer-detail.html?id=${q.BuyerID}&tab=pendingOrders" class="text-indigo-600 hover:text-indigo-800 font-semibold">前往開單</a></td>
                            </tr>`
                        }).join('') || `<tr><td colspan="10" class="p-8 text-center text-gray-400">沒有待處理的訂單項目</td></tr>`}
                        </tbody>
                    </table>
                </div>
            </div>`;
    }

    function renderFormalOrdersTab() {
        return `
            <div class="bg-white shadow-lg rounded-lg overflow-hidden">
                <div class="p-4 border-b"><p class="text-sm text-gray-600">展示、搜尋、篩選所有已成立的正式訂單。</p></div>
                <div class="overflow-x-auto">
                    <table class="min-w-full text-sm">
                        <thead class="bg-gray-100"><tr><th class="p-3 text-left font-semibold">訂單編號</th><th class="p-3 text-left font-semibold">購買者</th><th class="p-3 text-left font-semibold">供應商</th><th class="p-3 text-left font-semibold">訂單狀態</th><th class="p-3 text-left font-semibold">訂單建立時間</th><th class="p-3 text-left font-semibold">操作</th></tr></thead>
                        <tbody class="divide-y divide-gray-200">${db.Orders.map(o => `
                            <tr class="hover:bg-gray-50"><td class="p-3 font-mono">${o.OrderNumber}</td><td class="p-3">${findById('Buyers', o.BuyerID, 'BuyerID')?.BuyerName}</td><td class="p-3">${findById('Suppliers', o.SupplierID, 'SupplierID')?.SupplierName}</td><td class="p-3">${getStatusBadge(o.OrderStatus)}</td><td class="p-3">${formatDateTime(o.SystemCreatedAt)}</td>
                                <td class="p-3"><a href="./order-detail.html?id=${o.OrderID}" class="text-indigo-600 hover:text-indigo-800 font-semibold">查看詳情</a></td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
    }

    function handlePageEvents() {
        const pageContent = document.getElementById('page-content');
        pageContent.addEventListener('click', (e) => {
            const target = e.target.closest('[data-action="switch-tab"]');
            if (target) {
                pageState.activeTab = target.dataset.tab;
                renderPage();
            }
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        highlightCurrentNav();
        renderPage();
        handlePageEvents();
    });

</script>
</body>
</html>
