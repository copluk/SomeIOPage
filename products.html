<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>產品管理 - 內部貿易系統</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        body.modal-open { overflow: hidden; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

<div id="app" class="flex h-screen">

    <nav class="w-64 bg-white shadow-lg flex-shrink-0 flex flex-col">
        <a href="./products.html" class="p-4 border-b flex items-center gap-3 hover:bg-gray-50 transition-colors">
            <i class="fas fa-chart-line text-3xl text-indigo-600"></i>
            <h1 class="text-xl font-bold text-gray-800">內部貿易系統</h1>
        </a>
        <ul class="flex-grow">
            <li><a href="./suppliers.html" data-page="suppliers" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-truck w-5 text-center"></i><span>供應商管理</span></a></li>
            <li><a href="./buyers.html" data-page="buyers" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-users w-5 text-center"></i><span>購買者管理</span></a></li>
            <li><a href="./products.html" data-page="products" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-box-open w-5 text-center"></i><span>產品管理</span></a></li>
            <li><a href="./attributes.html" data-page="attributes" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-tags w-5 text-center"></i><span>產品屬性管理</span></a></li>
            <li><a href="./orders.html" data-page="orders" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-file-invoice-dollar w-5 text-center"></i><span>訂單管理</span></a></li>
            <li>
                <a href="./orderFinance.html" data-page="orderFinance" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200">
                    <i class="fas fa-chart-pie w-5 text-center"></i>
                    <span>訂單利潤</span>
                </a>
            </li>
        </ul>
    </nav>

    <main class="flex-1 p-6 md:p-8 overflow-y-auto bg-gray-50">

        <div class="fade-in">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold text-gray-900">產品管理</h2>
                <button data-action="show-add-product-modal" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700 transition duration-200 shadow-sm">
                    <i class="fas fa-plus mr-2"></i>新增產品
                </button>
            </div>
            <div class="mb-4 bg-white p-4 rounded-lg shadow-sm"><div class="grid grid-cols-1 md:grid-cols-4 gap-4"><input type="text" placeholder="依顯示名稱或代碼搜尋..." class="md:col-span-2 p-2 border border-gray-300 rounded-lg"><select class="p-2 border border-gray-300 rounded-lg"><option value="">所有供應商</option></select><select class="p-2 border border-gray-300 rounded-lg"><option value="">所有種類</option></select></div></div>
            <div class="bg-white shadow-lg rounded-lg overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead class="bg-gray-100"><tr><th class="p-4 text-left font-semibold text-gray-600">顯示名稱</th><th class="p-4 text-left font-semibold text-gray-600">供應商</th><th class="p-4 text-left font-semibold text-gray-600">產地</th><th class="p-4 text-left font-semibold text-gray-600">產號</th><th class="p-4 text-left font-semibold text-gray-600">品牌</th><th class="p-4 text-left font-semibold text-gray-600">種類</th><th class="p-4 text-left font-semibold text-gray-600">部位</th><th class="p-4 text-left font-semibold text-gray-600">規格</th><th class="p-4 text-left font-semibold text-gray-600">包裝</th><th class="p-4 text-left font-semibold text-gray-600">操作</th></tr></thead>
                    <tbody id="products-table-body" class="divide-y divide-gray-200"></tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<div id="modal-container" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 p-4 fade-in"></div>

<script>
    // --- 資料模型 (Data Model) ---
    const db = {
         Users: [ { UserID: 1, FullName: "林業務" }, { UserID: 2, FullName: "陳經理" } ],
         Suppliers: [ { SupplierID: 1, SupplierName: "環球肉品公司" }, { SupplierID: 2, SupplierName: "頂級海鮮直送" } ],
         Production_Areas: [ { AreaID: 1, AreaName: "巴西" }, { AreaID: 2, AreaName: "越南" }, { AreaID: 3, AreaName: "加拿大" }, { AreaID: 4, AreaName: "日本" }, { AreaID: 5, AreaName: "智利" }, { AreaID: 6, AreaName: "西班牙" }, { AreaID: 7, AreaName: "台灣" }, { AreaID: 8, AreaName: "澳洲" } ],
         Supplier_Area_Assignments: [ { AssignmentID: 1, SupplierID: 1, AreaID: 8 }, { AssignmentID: 2, SupplierID: 1, AreaID: 6 }, { AssignmentID: 3, SupplierID: 1, AreaID: 7 }, { AssignmentID: 4, SupplierID: 2, AreaID: 3 }, { AssignmentID: 5, SupplierID: 2, AreaID: 4 }, { AssignmentID: 6, SupplierID: 2, AreaID: 5 } ],
         Supplier_Production_Numbers: [ { ProdNumID: 1, AssignmentID: 1, ProductionNumber: "SIF 121" }, { ProdNumID: 2, AssignmentID: 2, ProductionNumber: "ESP 456" }, { ProdNumID: 3, AssignmentID: 3, ProductionNumber: "TW 789" }, { ProdNumID: 4, AssignmentID: 4, ProductionNumber: "CAN 111" }, { ProdNumID: 5, AssignmentID: 5, ProductionNumber: "JAP 222" }, { ProdNumID: 6, AssignmentID: 6, ProductionNumber: "CHL 333" } ],
         Sub_Brands: [ { SubBrandID: 1, ProdNumID: 1, SubBrandName: "World's Best Beef" }, { SubBrandID: 2, ProdNumID: 2, SubBrandName: "Iberico Gold" }, { SubBrandID: 3, ProdNumID: 3, SubBrandName: "台灣正黑豬" }, { SubBrandID: 4, ProdNumID: 4, SubBrandName: "Ocean's Catch" }, { SubBrandID: 5, ProdNumID: 5, SubBrandName: "Hokkaido Select" }, { SubBrandID: 6, ProdNumID: 6, SubBrandName: "Andes Salmon" } ],
         Product_Categories: [ { CategoryID: 1, PartName_ZH: "牛肉" }, { CategoryID: 2, PartName_ZH: "豬肉" }, { CategoryID: 3, PartName_ZH: "海鮮" } ],
         Product_Parts: [ { PartID: 1, PartName_ZH: "肋眼" }, { PartID: 3, PartName_ZH: "梅花" }, { PartID: 4, PartName_ZH: "五花" }, { PartID: 5, PartName_ZH: "龍蝦" }, { PartID: 6, PartName_ZH: "干貝" }, { PartID: 7, PartName_ZH: "鮭魚" } ],
         Product_Specs: [ { SpecID: 1, SpecName_ZH: "M9" }, { SpecID: 2, SpecName_ZH: "Bellota" }, { SpecID: 3, SpecName_ZH: "活菌飼養" }, { SpecID: 4, SpecName_ZH: "野生" }, { SpecID: 5, SpecName_ZH: "生食級" }, { SpecID: 6, SpecName_ZH: "輪切" } ],
         Product_Packagings: [ { PackagingID: 2, PackagingName_ZH: "原塊" }, { PackagingID: 4, PackagingName_ZH: "真空包裝" }, { PackagingID: 6, PackagingName_ZH: "真空包裝" }, { PackagingID: 7, PackagingName_ZH: "禮盒裝" } ],
         Products: [ { ProductID: 1, SupplierID: 1, CategoryID: 1, PartID: 1, SpecID: 1, PackagingID: 2, ProductDisplayName: "澳洲和牛M9肋眼", ProductCode: "AW-RB-G9-001", AreaID: 8, ProdNumID: 1, SubBrandID: 1 }, { ProductID: 2, SupplierID: 1, CategoryID: 2, PartID: 3, SpecID: 2, PackagingID: 4, ProductDisplayName: "西班牙伊比利豬梅花", ProductCode: "SP-Pork-001", AreaID: 6, ProdNumID: 2, SubBrandID: 2 }, { ProductID: 3, SupplierID: 1, CategoryID: 2, PartID: 4, SpecID: 3, PackagingID: 4, ProductDisplayName: "台灣活菌豬五花", ProductCode: "TW-Pork-005", AreaID: 7, ProdNumID: 3, SubBrandID: 3 }, { ProductID: 4, SupplierID: 2, CategoryID: 3, PartID: 5, SpecID: 4, PackagingID: 7, ProductDisplayName: "波士頓龍蝦", ProductCode: "SEA-LOB-01", AreaID: 3, ProdNumID: 4, SubBrandID: 4 }, { ProductID: 5, SupplierID: 2, CategoryID: 3, PartID: 6, SpecID: 5, PackagingID: 6, ProductDisplayName: "北海道干貝", ProductCode: "SEA-SCA-03", AreaID: 4, ProdNumID: 5, SubBrandID: 5 }, { ProductID: 6, SupplierID: 2, CategoryID: 3, PartID: 7, SpecID: 6, PackagingID: 6, ProductDisplayName: "智利鮭魚", ProductCode: "SEA-SAL-02", AreaID: 5, ProdNumID: 6, SubBrandID: 6 } ]
    };

    // --- 共用輔助函式 ---
    const findById = (collectionName, id, keyName) => db[collectionName].find(item => item[keyName] === id);
    const highlightCurrentNav = () => { let currentPage = window.location.pathname.split('/').pop().replace('.html', ''); if (!currentPage || currentPage === 'index') { currentPage = 'products'; } const activeLink = document.querySelector(`a[data-page="${currentPage}"]`); if (activeLink) { activeLink.classList.add('bg-indigo-50', 'text-indigo-600', 'font-bold', 'border-l-4', 'border-indigo-600'); } };

    // --- Modal Functions & State ---
    const modalContainer = document.getElementById('modal-container');
    let modalState = {}; // 用於追蹤 modal 內部的選項

    function showModal(title, content) {
        modalContainer.innerHTML = `<div class="bg-white rounded-lg shadow-xl w-full max-w-4xl m-auto"><div class="flex justify-between items-center p-5 border-b"><h3 class="text-xl font-bold">${title}</h3><button data-action="close-modal" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button></div><div class="p-6 max-h-[70vh] overflow-y-auto">${content}</div><div class="flex justify-end p-4 bg-gray-50 border-t"><button data-action="close-modal" class="bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-lg mr-2 hover:bg-gray-300">取消</button><button data-action="close-modal" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700">儲存 (展示)</button></div></div>`;
        modalContainer.classList.remove('hidden');
        document.body.classList.add('modal-open');
        attachModalEventListeners();
    }
    function closeModal() {
        if(modalContainer) { modalContainer.classList.add('hidden'); document.body.classList.remove('modal-open'); }
        modalState = {}; // Reset state on close
    }

    function getModalContent(type) {
        const inputClass = "mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm";
        const labelClass = "block text-sm font-medium text-gray-700";
        if (type === 'add-product') {
            return `
                <div id="add-product-form" class="space-y-8">
                    <div><h4 class="text-lg font-semibold text-indigo-700 border-b pb-2 mb-4">第一步：選擇供應商</h4>
                        <label class="${labelClass}">供應商 *</label>
                        <select id="supplier-select" data-step="1" class="${inputClass}">
                            <option value="">請選擇...</option>
                            ${db.Suppliers.map(s => `<option value="${s.SupplierID}">${s.SupplierName}</option>`).join('')}
                        </select>
                    </div>
                    <div id="step-2-source" class="space-y-4 hidden"><h4 class="text-lg font-semibold text-indigo-700 border-b pb-2 mb-4">第二步：選擇來源資訊</h4>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div><label class="${labelClass}">產區</label><select id="area-select" data-step="2" class="${inputClass}" disabled><option>請先選供應商</option></select></div>
                            <div><label class="${labelClass}">產號</label><select id="prodnum-select" data-step="3" class="${inputClass}" disabled><option>請先選產區</option></select></div>
                            <div><label class="${labelClass}">子品牌</label><select id="brand-select" data-step="4" class="${inputClass}" disabled><option>請先選產號</option></select></div>
                        </div>
                    </div>
                    <div id="step-3-attributes" class="space-y-4 hidden"><h4 class="text-lg font-semibold text-indigo-700 border-b pb-2 mb-4">第三步：選擇產品分類屬性 (展示用，實際為可搜尋選單)</h4>
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div><label class="${labelClass}">種類 *</label><select data-step="5" id="category-select" class="${inputClass}">${db.Product_Categories.map(c => `<option value="${c.PartName_ZH}">${c.PartName_ZH}</option>`).join('')}</select></div>
                            <div><label class="${labelClass}">部位 *</label><select data-step="5" id="part-select" class="${inputClass}">${db.Product_Parts.map(p => `<option value="${p.PartName_ZH}">${p.PartName_ZH}</option>`).join('')}</select></div>
                            <div><label class="${labelClass}">規格 *</label><select data-step="5" id="spec-select" class="${inputClass}">${db.Product_Specs.map(s => `<option value="${s.SpecName_ZH}">${s.SpecName_ZH}</option>`).join('')}</select></div>
                            <div><label class="${labelClass}">包裝 *</label><select data-step="5" id="packaging-select" class="${inputClass}">${db.Product_Packagings.map(p => `<option value="${p.PackagingName_ZH}">${p.PackagingName_ZH}</option>`).join('')}</select></div>
                        </div>
                    </div>
                    <div id="step-4-final" class="space-y-4 hidden"><h4 class="text-lg font-semibold text-indigo-700 border-b pb-2 mb-4">第四步：填寫最終產品資訊</h4>
                         <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div><label class="${labelClass}">產品顯示名稱 *</label><input type="text" id="display-name-input" class="${inputClass}"></div>
                            <div><label class="${labelClass}">產品代碼 (SKU)</label><input type="text" class="${inputClass}"></div>
                         </div>
                    </div>
                </div>`;
        } return '';
    }

    // --- products.html 頁面專屬的 JavaScript 邏輯 ---
    function renderProductTable() {
        const tableBody = document.getElementById('products-table-body');
        if (!tableBody) return;
        tableBody.innerHTML = db.Products.map(product => {
            const supplier = findById('Suppliers', product.SupplierID, 'SupplierID');
            const category = findById('Product_Categories', product.CategoryID, 'CategoryID');
            const part = findById('Product_Parts', product.PartID, 'PartID');
            const spec = findById('Product_Specs', product.SpecID, 'SpecID');
            const packaging = findById('Product_Packagings', product.PackagingID, 'PackagingID');
            const area = findById('Production_Areas', product.AreaID, 'AreaID');
            const prodNum = findById('Supplier_Production_Numbers', product.ProdNumID, 'ProdNumID');
            const brand = findById('Sub_Brands', product.SubBrandID, 'SubBrandID');
            return `
                <tr class="hover:bg-gray-50">
                    <td class="p-4 font-semibold">${product.ProductDisplayName}</td><td class="p-4">${supplier?.SupplierName || 'N/A'}</td>
                    <td class="p-4">${area?.AreaName || 'N/A'}</td><td class="p-4">${prodNum?.ProductionNumber || 'N/A'}</td>
                    <td class="p-4">${brand?.SubBrandName || 'N/A'}</td><td class="p-4">${category?.PartName_ZH || 'N/A'}</td>
                    <td class="p-4">${part?.PartName_ZH || 'N/A'}</td><td class="p-4">${spec?.SpecName_ZH || 'N/A'}</td>
                    <td class="p-4">${packaging?.PackagingName_ZH || 'N/A'}</td>
                    <td class="p-4 space-x-4 whitespace-nowrap"><button class="text-gray-500 hover:text-gray-800 font-semibold text-sm">編輯</button><a href="./product-detail.html?id=${product.ProductID}" class="text-indigo-600 hover:text-indigo-800 font-semibold text-sm">查看詳情</a></td>
                </tr>`;
        }).join('');
    }

    function handleModalLogic() {
        const form = document.getElementById('add-product-form');
        if (!form) return;

        const supplierSelect = form.querySelector('#supplier-select');
        const areaSelect = form.querySelector('#area-select');
        const prodNumSelect = form.querySelector('#prodnum-select');
        const brandSelect = form.querySelector('#brand-select');
        const step2 = form.querySelector('#step-2-source');
        const step3 = form.querySelector('#step-3-attributes');
        const step4 = form.querySelector('#step-4-final');
        const attributeSelects = form.querySelectorAll('[data-step="5"]');
        const displayNameInput = form.querySelector('#display-name-input');

        const updateSelectOptions = (select, options, placeholder) => {
            select.innerHTML = `<option value="">${placeholder}</option>` + options.map(o => `<option value="${o.id}">${o.name}</option>`).join('');
            select.disabled = false;
        };

        const generateDisplayName = () => {
            const supplier = findById('Suppliers', modalState.supplierId, 'SupplierID')?.SupplierName;
            const area = findById('Production_Areas', modalState.areaId, 'AreaID')?.AreaName;
            const brand = findById('Sub_Brands', modalState.brandId, 'SubBrandID')?.SubBrandName;
            const category = form.querySelector('#category-select').value;
            const part = form.querySelector('#part-select').value;
            const spec = form.querySelector('#spec-select').value;
            const nameParts = [area, brand, part, spec].filter(Boolean); // 過濾掉空值
            displayNameInput.value = nameParts.join(' ');
        };

        form.addEventListener('change', (e) => {
            const step = e.target.dataset.step;
            if (step === "1") { // Supplier selected
                modalState.supplierId = parseInt(e.target.value);
                const assignments = db.Supplier_Area_Assignments.filter(a => a.SupplierID === modalState.supplierId);
                const areaIds = assignments.map(a => a.AreaID);
                const areaOptions = db.Production_Areas.filter(a => areaIds.includes(a.AreaID)).map(a => ({ id: a.AreaID, name: a.AreaName }));
                updateSelectOptions(areaSelect, areaOptions, '請選擇產區');
                step2.classList.remove('hidden');
            } else if (step === "2") { // Area selected
                modalState.areaId = parseInt(e.target.value);
                const assignment = db.Supplier_Area_Assignments.find(a => a.SupplierID === modalState.supplierId && a.AreaID === modalState.areaId);
                const prodNumOptions = db.Supplier_Production_Numbers.filter(pn => pn.AssignmentID === assignment.AssignmentID).map(pn => ({ id: pn.ProdNumID, name: pn.ProductionNumber }));
                updateSelectOptions(prodNumSelect, prodNumOptions, '請選擇產號');
            } else if (step === "3") { // Production Number selected
                modalState.prodNumId = parseInt(e.target.value);
                const brandOptions = db.Sub_Brands.filter(b => b.ProdNumID === modalState.prodNumId).map(b => ({ id: b.SubBrandID, name: b.SubBrandName }));
                updateSelectOptions(brandSelect, brandOptions, '請選擇子品牌');
            } else if (step === "4") { // Brand selected
                modalState.brandId = parseInt(e.target.value);
                step3.classList.remove('hidden');
                step4.classList.remove('hidden');
            } else if (step === "5") { // Attribute selected
                generateDisplayName();
            }
        });
    }

    function attachModalEventListeners() {
        const modal = document.querySelector('#add-product-form');
        if (modal) {
            handleModalLogic();
        }
    }

    function handlePageEvents() {
        const pageContent = document.querySelector('main');
        pageContent.addEventListener('click', (e) => {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            if (target.dataset.action === 'show-add-product-modal') {
                showModal('新增產品', getModalContent('add-product'));
            }
        });
        modalContainer.addEventListener('click', (e) => {
             if (e.target.id === 'modal-container' || e.target.closest('[data-action="close-modal"]')) { closeModal(); }
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        highlightCurrentNav();
        renderProductTable();
        handlePageEvents();
    });

</script>
</body>
</html>
