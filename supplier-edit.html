<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編輯供應商 - 內部貿易系統</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        body.modal-open { overflow: hidden; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

<div id="app" class="flex h-screen">

    <nav class="w-64 bg-white shadow-lg flex-shrink-0 flex flex-col">
        <a href="./products.html" class="p-4 border-b flex items-center gap-3 hover:bg-gray-50 transition-colors">
            <i class="fas fa-chart-line text-3xl text-indigo-600"></i>
            <h1 class="text-xl font-bold text-gray-800">內部貿易系統</h1>
        </a>
        <ul class="flex-grow">
            <li><a href="./suppliers.html" data-page="suppliers" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-truck w-5 text-center"></i><span>供應商管理</span></a></li>
            <li><a href="./buyers.html" data-page="buyers" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-users w-5 text-center"></i><span>購買者管理</span></a></li>
            <li><a href="./products.html" data-page="products" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-box-open w-5 text-center"></i><span>產品管理</span></a></li>
            <li><a href="./attributes.html" data-page="attributes" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-tags w-5 text-center"></i><span>產品屬性管理</span></a></li>
            <li><a href="./orders.html" data-page="orders" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-file-invoice-dollar w-5 text-center"></i><span>訂單管理</span></a></li>
        </ul>
    </nav>

    <main id="page-content" class="flex-1 flex flex-col overflow-y-auto bg-gray-50">
        <div class="text-center p-8 text-gray-500">正在載入資料...</div>
    </main>
</div>

<div id="modal-container" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center z-50 p-4 fade-in"></div>


<script>
    // --- 假資料 (V4.2) ---
    const db = {
        Users: [{ UserID: 1, FullName: "林業務" }, { UserID: 2, FullName: "陳經理" }],
        Suppliers: [{ SupplierID: 1, SupplierName: "環球肉品公司", PaymentTerms: "月結30天", WebsiteURL: "https://www.worldmeat.com", Remarks: "每週一、四固定出貨。" }, { SupplierID: 2, SupplierName: "頂級海鮮直送", PaymentTerms: "貨到付款", WebsiteURL: "https://www.topseafood.com", Remarks: "需提前三天預訂特殊品項。" }],
        Supplier_User_Assignments: [{ SupplierID: 1, UserID: 2, ResponsibilityType: '主要採購' }, { SupplierID: 2, UserID: 1, ResponsibilityType: '主要採購' }],
        Supplier_Contacts: [{ ContactID: 1, SupplierID: 1, ContactName: "王經理", ContactRole: "採購窗口", Email: "wang@worldmeat.com", Phone: "02-2788-1234", IsPrimary: true }, { ContactID: 2, SupplierID: 1, ContactName: "張小姐", ContactRole: "財務", Email: "chang@worldmeat.com", Phone: "02-2788-1235", IsPrimary: false }, { ContactID: 3, SupplierID: 2, ContactName: "李小姐", ContactRole: "業務窗口", Email: "lee@topseafood.com", Phone: "07-555-8888", IsPrimary: true }],
        Production_Areas: [{ AreaID: 1, AreaName: "巴西", AreaCode: "BR" }, { AreaID: 2, AreaName: "越南", AreaCode: "VN" }],
        Supplier_Area_Assignments: [{ AssignmentID: 1, SupplierID: 1, AreaID: 1 }, { AssignmentID: 2, SupplierID: 1, AreaID: 2 }],
        Supplier_Production_Numbers: [{ ProdNumID: 1, AssignmentID: 1, ProductionNumber: "SIF 121", Description: "主要牛肉產線" }, { ProdNumID: 2, AssignmentID: 1, ProductionNumber: "SIF 235", Description: "副產品產線" }, { ProdNumID: 3, AssignmentID: 2, ProductionNumber: "VN 789", Description: "冷凍豬肉產線" }],
        Sub_Brands: [{ SubBrandID: 1, ProdNumID: 1, SubBrandName: "World's Best Beef" }, { SubBrandID: 2, ProdNumID: 1, SubBrandName: "Prime Cut" }, { SubBrandID: 3, ProdNumID: 3, SubBrandName: "Saigon Pork" }]
    };

    // --- 共用輔助函式 ---
    const findById = (collectionName, id, keyName) => db[collectionName].find(item => item[keyName] === id);
    const highlightCurrentNav = () => { const currentPage = 'suppliers'; const activeLink = document.querySelector(`a[data-page="${currentPage}"]`); if (activeLink) { activeLink.classList.add('bg-indigo-50', 'text-indigo-600', 'font-bold', 'border-l-4', 'border-indigo-600'); } };
    const inputClass = "mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm";
    const labelClass = "block text-sm font-medium text-gray-700";

    // --- Modal Functions ---
    const modalContainer = document.getElementById('modal-container');
    function showModal(title, content) { modalContainer.innerHTML = `<div class="bg-white rounded-lg shadow-xl w-full max-w-lg m-auto"><div class="flex justify-between items-center p-5 border-b"><h3 class="text-xl font-bold">${title}</h3><button data-action="close-modal" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button></div><div class="p-6" id="modal-content-body">${content}</div><div class="flex justify-end p-4 bg-gray-50 border-t"><button data-action="close-modal" class="bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-lg mr-2 hover:bg-gray-300">取消</button><button data-action="close-modal" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700">儲存 (展示)</button></div></div>`; modalContainer.classList.remove('hidden'); document.body.classList.add('modal-open'); attachModalEventListeners(); }
    function closeModal() { if(modalContainer) { modalContainer.classList.add('hidden'); document.body.classList.remove('modal-open'); } }
    function getModalContent(type, options) {
        if (type === 'manage-brands') {
            const prodNum = findById('Supplier_Production_Numbers', options.prodNumId, 'ProdNumID');
            const brands = db.Sub_Brands.filter(b => b.ProdNumID === options.prodNumId);
            return `<div>
                <h4 class="font-semibold mb-2">管理子品牌 (產號: ${prodNum?.ProductionNumber})</h4>
                <ul id="brand-list" class="space-y-2">${brands.map(b => `<li class="flex justify-between items-center p-2 bg-gray-100 rounded"><span>${b.SubBrandName}</span><button class="text-red-500 text-xs font-semibold">移除</button></li>`).join('')}</ul>
                <div class="mt-4 flex gap-2"><input id="new-brand-name" type="text" placeholder="新增子品牌名稱..." class="${inputClass} flex-grow"><button data-action="add-new-brand" class="bg-blue-500 text-white px-3 rounded-md text-sm">新增</button></div>
            </div>`;
        } return '';
    }

    // --- supplier-edit.html 頁面專屬邏輯 ---
    const pageState = { isEditMode: false, supplierId: null, supplierData: null, activeTab: 'basic', selectedAreaId: null };

    function renderPage() {
        const pageContent = document.getElementById('page-content');
        if (!pageContent) return;
        const title = pageState.isEditMode ? `編輯供應商：${pageState.supplierData.SupplierName}` : '新增供應商';
        pageContent.innerHTML = `
            <div class="p-6 border-b bg-white sticky top-0 z-10"><div class="flex justify-between items-center"><h2 class="text-2xl font-bold text-gray-900">${title}</h2><div class="space-x-3"><a href="./suppliers.html" class="bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded-lg hover:bg-gray-300">取消</a><button class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700">儲存</button></div></div></div>
            <div class="p-6"><div class="border-b border-gray-200"><nav class="-mb-px flex space-x-8">${renderTabs()}</nav></div><div id="tab-content-container" class="mt-6">${renderTabContent()}</div></div>
        `;
    }

    function renderTabs() {
        const tabs = [{ key: 'basic', name: '基本資料與負責人' }, { key: 'contacts', name: '供應商聯絡人' }, { key: 'brands', name: '品牌管理' }];
        return tabs.map(t => `<button data-action="switch-tab" data-tab="${t.key}" class="py-4 px-1 border-b-2 font-medium text-sm ${pageState.activeTab === t.key ? 'border-indigo-500 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}">${t.name}</button>`).join('');
    }

    function renderTabContent() {
        switch (pageState.activeTab) {
            case 'basic': return renderBasicInfoTab();
            case 'contacts': return renderContactsTab();
            case 'brands': return renderBrandManagementTab();
        }
    }

    function renderBasicInfoTab() {
        const supplier = pageState.supplierData || {};
        const assignment = pageState.isEditMode ? db.Supplier_User_Assignments.find(a => a.SupplierID === pageState.supplierId) : {};
        const userOptions = db.Users.map(u => `<option value="${u.UserID}" ${assignment?.UserID === u.UserID ? 'selected' : ''}>${u.FullName}</option>`).join('');
        return `<div class="bg-white p-6 rounded-lg shadow-md max-w-4xl mx-auto space-y-6 fade-in"><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div><label class="${labelClass}">供應商名稱 *</label><input type="text" value="${supplier.SupplierName || ''}" class="${inputClass}"></div><div><label class="${labelClass}">我方採購負責人</label><select class="${inputClass}">${userOptions}</select></div><div><label class="${labelClass}">付款條件</label><input type="text" value="${supplier.PaymentTerms || ''}" class="${inputClass}"></div><div><label class="${labelClass}">官方網站</label><input type="url" value="${supplier.WebsiteURL || ''}" class="${inputClass}"></div><div class="md:col-span-2"><label class="${labelClass}">備註</label><textarea rows="4" class="${inputClass}">${supplier.Remarks || ''}</textarea></div></div></div>`;
    }

    function renderContactsTab() {
        const contacts = pageState.isEditMode ? db.Supplier_Contacts.filter(c => c.SupplierID === pageState.supplierId) : [];
        return `<div class="bg-white p-6 rounded-lg shadow-md max-w-6xl mx-auto fade-in"><div class="flex justify-end mb-4"><button class="bg-green-500 text-white font-bold py-2 px-4 rounded-lg hover:bg-green-600 text-sm">新增聯絡人</button></div><div class="space-y-4">${contacts.map(c => `<div class="grid grid-cols-12 gap-4 items-center p-3 border rounded-lg"><div class="col-span-12 md:col-span-2"><label class="${labelClass}">聯絡人姓名 *</label><input type="text" value="${c.ContactName}" class="${inputClass}"></div><div class="col-span-12 md:col-span-2"><label class="${labelClass}">角色</label><input type="text" value="${c.ContactRole}" class="${inputClass}"></div><div class="col-span-12 md:col-span-3"><label class="${labelClass}">Email</label><input type="email" value="${c.Email}" class="${inputClass}"></div><div class="col-span-12 md:col-span-2"><label class="${labelClass}">電話</label><input type="tel" value="${c.Phone}" class="${inputClass}"></div><div class="col-span-6 md:col-span-2 pt-6 flex items-center gap-2"><input type="checkbox" ${c.IsPrimary ? 'checked' : ''} id="is-primary-${c.ContactID}" class="h-4 w-4 rounded border-gray-300 text-indigo-600"><label for="is-primary-${c.ContactID}">設為主要</label></div><div class="col-span-6 md:col-span-1 pt-6 text-right"><button class="text-red-500 hover:text-red-700">移除</button></div></div>`).join('') || `<p class="text-center text-gray-500 py-4">尚無聯絡人資料。</p>`}</div></div>`;
    }

    function renderBrandManagementTab() {
        let assignedAreas = [];
        if(pageState.isEditMode) {
            const assignments = db.Supplier_Area_Assignments.filter(a => a.SupplierID === pageState.supplierId);
            const areaIds = assignments.map(a => a.AreaID);
            assignedAreas = db.Production_Areas.filter(area => areaIds.includes(area.AreaID));
        }
        if (pageState.selectedAreaId === null && assignedAreas.length > 0) pageState.selectedAreaId = assignedAreas[0].AreaID;

        const assignment = db.Supplier_Area_Assignments.find(a => a.SupplierID === pageState.supplierId && a.AreaID === pageState.selectedAreaId);
        const prodNumbers = assignment ? db.Supplier_Production_Numbers.filter(pn => pn.AssignmentID === assignment.AssignmentID) : [];

        return `<div class="grid grid-cols-1 md:grid-cols-3 gap-6 fade-in">
            <div class="md:col-span-1 bg-white p-4 rounded-lg shadow-sm"><div class="flex justify-between items-center mb-2 pb-2 border-b"><h3 class="font-bold text-gray-700">產區列表</h3><button data-action="add-new-area" class="text-indigo-600 text-sm font-semibold hover:text-indigo-800">新增產區</button></div><ul id="area-list" class="space-y-1">${assignedAreas.map(a => `<li data-action="select-area" data-id="${a.AreaID}" class="p-2 rounded cursor-pointer ${a.AreaID === pageState.selectedAreaId ? 'bg-indigo-100 font-bold text-indigo-700' : 'hover:bg-gray-100'}">${a.AreaName} (${a.AreaCode})</li>`).join('')}</ul></div>
            <div class="md:col-span-2 bg-white p-6 rounded-lg shadow-sm">
                ${pageState.selectedAreaId ? `<div class="flex justify-between items-center mb-4"><h3 class="text-xl font-bold text-gray-800">${findById('Production_Areas', pageState.selectedAreaId, 'AreaID')?.AreaName} - 產號列表</h3><button data-action="add-prod-num" class="bg-blue-500 text-white text-sm font-bold py-2 px-3 rounded-lg hover:bg-blue-600">新增產號</button></div><div class="overflow-x-auto"><table class="min-w-full text-sm"><thead class="bg-gray-100"><tr><th class="p-2 text-left">產號編碼</th><th class="p-2 text-left">描述</th><th class="p-2 text-left">操作</th></tr></thead><tbody id="prod-num-tbody" class="divide-y divide-gray-200">${prodNumbers.map(pn => `<tr><td class="p-2 font-mono">${pn.ProductionNumber}</td><td class="p-2">${pn.Description}</td><td class="p-2 space-x-2"><button data-action="show-brands-modal" data-prodnum-id="${pn.ProdNumID}" class="text-green-600 font-semibold">管理子品牌</button><button class="text-red-600">移除</button></td></tr>`).join('') || `<tr><td colspan="3" class="p-4 text-center text-gray-400">此產區尚無產號</td></tr>`}</tbody></table></div>` : `<div class="text-center text-gray-500 flex items-center justify-center h-full">請先新增或從左側選擇一個產區。</div>`}
            </div>
        </div>`;
    }

    // --- Event Handlers ---
    function handlePageEvents() {
        const pageContent = document.getElementById('page-content');
        pageContent.addEventListener('click', (e) => {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            const { action, tab, id, prodnumId } = target.dataset;

            if (action === 'switch-tab') { pageState.activeTab = tab; renderPage(); }
            else if (action === 'select-area') { pageState.selectedAreaId = parseInt(id); renderPage(); }
            else if (action === 'show-brands-modal') { showModal('管理子品牌', getModalContent('manage-brands', { prodNumId: parseInt(prodnumId) })); }
            else if (action === 'add-new-area') {
                const areaList = document.getElementById('area-list');
                const newLi = document.createElement('li');
                newLi.className = 'p-2';
                newLi.innerHTML = `<input type="text" class="${inputClass}" placeholder="輸入新產區名稱...">`;
                areaList.appendChild(newLi);
                newLi.querySelector('input').focus();
            } else if (action === 'add-prod-num') {
                const numTbody = document.getElementById('prod-num-tbody');
                const newRow = numTbody.insertRow();
                newRow.innerHTML = `<td class="p-2"><input type="text" class="${inputClass}" placeholder="產號編碼"></td><td class="p-2"><input type="text" class="${inputClass}" placeholder="描述"></td><td class="p-2"><button class="text-gray-400">儲存</button></td>`;
            }
        });

    }

    function attachModalEventListeners() {
        const modalBody = document.getElementById('modal-content-body');
        if (!modalBody) return;
        modalBody.addEventListener('click', (e) => {
            const target = e.target.closest('[data-action="add-new-brand"]');
            if (target) {
                const brandList = document.getElementById('brand-list');
                const brandInput = document.getElementById('new-brand-name');
                if (brandList && brandInput && brandInput.value) {
                     const newLi = document.createElement('li');
                     newLi.className = 'flex justify-between items-center p-2 bg-gray-100 rounded';
                     newLi.innerHTML = `<span>${brandInput.value}</span><button class="text-red-500 text-xs font-semibold">移除</button>`;
                     brandList.appendChild(newLi);
                     brandInput.value = '';
                }
            }
        });
        modalContainer.addEventListener('click', (e) => {
             if (e.target.id === 'modal-container' || e.target.closest('[data-action="close-modal"]')) { closeModal(); }
        });
    }


    document.addEventListener('DOMContentLoaded', () => {
        highlightCurrentNav();
        const urlParams = new URLSearchParams(window.location.search);
        const supplierId = parseInt(urlParams.get('id'));
        if (supplierId) { pageState.isEditMode = true; pageState.supplierId = supplierId; pageState.supplierData = findById('Suppliers', supplierId, 'SupplierID'); }
        else { pageState.isEditMode = false; }
        renderPage();
        handlePageEvents();
    });

</script>
</body>
</html>
