<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單詳情 - 內部貿易系統</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

<div id="app" class="flex h-screen">

    <nav class="w-64 bg-white shadow-lg flex-shrink-0 flex flex-col">
        <a href="./products.html" class="p-4 border-b flex items-center gap-3 hover:bg-gray-50 transition-colors">
            <i class="fas fa-chart-line text-3xl text-indigo-600"></i>
            <h1 class="text-xl font-bold text-gray-800">內部貿易系統</h1>
        </a>
        <ul class="flex-grow">
            <li><a href="./suppliers.html" data-page="suppliers" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-truck w-5 text-center"></i><span>供應商管理</span></a></li>
            <li><a href="./buyers.html" data-page="buyers" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-users w-5 text-center"></i><span>購買者管理</span></a></li>
            <li><a href="./products.html" data-page="products" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-box-open w-5 text-center"></i><span>產品管理</span></a></li>
            <li><a href="./attributes.html" data-page="attributes" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-tags w-5 text-center"></i><span>產品屬性管理</span></a></li>
            <li><a href="./orders.html" data-page="orders" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200"><i class="fas fa-file-invoice-dollar w-5 text-center"></i><span>訂單管理</span></a></li>
            <li>
                <a href="./orderFinance.html" data-page="orderFinance" class="flex items-center gap-3 p-4 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 transition-colors duration-200">
                    <i class="fas fa-chart-pie w-5 text-center"></i>
                    <span>訂單利潤</span>
                </a>
            </li>
        </ul>
    </nav>

    <main id="page-content" class="flex-1 p-6 md:p-8 overflow-y-auto bg-gray-50">
        <div class="text-center text-gray-500">正在載入資料...</div>
    </main>
</div>

<script>
    // --- 資料模型 (Data Model) - UPDATED with more order details ---
    const db = {
         Users: [ { UserID: 1, FullName: "林業務" }, { UserID: 2, FullName: "陳經理" } ],
         Suppliers: [ { SupplierID: 1, SupplierName: "環球肉品公司" }, { SupplierID: 2, SupplierName: "頂級海鮮直送" } ],
         Buyers: [ { BuyerID: 101, BuyerName: "A級牛排館" }, { BuyerID: 102, BuyerName: "饗食天堂餐飲集團" } ],
         Products: [
            { ProductID: 1, ProductDisplayName: "澳洲和牛M9肋眼", SpecID: 1 },
            { ProductID: 6, ProductDisplayName: "智利鮭魚", SpecID: 6 }
         ],
         Product_Specs: [ { SpecID: 1, SpecName_ZH: "M9 Grade" }, { SpecID: 6, SpecName_ZH: "輪切" } ],
         Quotes_To_Buyers: [
            { QuoteToBuyerID: 10, ProductID: 1, QuotedPrice: 2260 },
            { QuoteToBuyerID: 7, ProductID: 6, QuotedPrice: 1100 },
        ],
         Orders: [
            {
                OrderID: 10, OrderNumber: "ORD-202506-010", BuyerID: 101, SupplierID: 1,
                LoadingTimestamp: "2025-07-15T00:00:00Z", ArrivalTimestamp: "2025-08-20T00:00:00Z",
                ActualArrivalTimestamp: null, PaymentMethod: "T/T 30 days", OrderStatus: "Confirmed",
                PaymentStatus: "Unpaid", BookingNumber: "BK-12345", ContainerNumber: "FCIU7654321",
                LoadProgress: "已通知工廠備貨", DoaProgress: "等待電放", PayProgress: "等待客戶付款",
                CreatedByUserID: 1, SystemCreatedAt: "2025-06-14T10:00:00Z"
            }
         ],
         Order_Line_Items: [
            { LineItemID: 10, OrderID: 10, QuoteToBuyerID: 10, ProductID: 1, Weight: 250.5, FinalSellingPrice: 2260, FinalCostPrice: 1870 },
            { LineItemID: 11, OrderID: 10, QuoteToBuyerID: 7, ProductID: 6, Weight: 800.0, FinalSellingPrice: 1100, FinalCostPrice: 740 }
         ]
    };

    // --- 共用輔助函式 ---
    const formatDateTime = (iso) => iso ? new Date(iso).toISOString().slice(0, 16) : '';
    const findById = (collectionName, id, keyName) => db[collectionName].find(item => item[keyName] === id);
    const highlightCurrentNav = () => { const currentPage = 'orders'; const activeLink = document.querySelector(`a[data-page="${currentPage}"]`); if (activeLink) { activeLink.classList.add('bg-indigo-50', 'text-indigo-600', 'font-bold', 'border-l-4', 'border-indigo-600'); } };

    // --- order-detail.html 頁面專屬邏輯 ---
    function renderPage(orderId) {
        const pageContent = document.getElementById('page-content');
        const order = findById('Orders', orderId, 'OrderID');
        if (!order) {
            pageContent.innerHTML = `<div class="text-center text-red-500 font-bold">錯誤：找不到 ID 為 ${orderId} 的訂單。</div>`; return;
        }
        pageContent.innerHTML = `
            <div class="fade-in max-w-6xl mx-auto space-y-8">
                <div>
                    <a href="./orders.html" class="text-indigo-600 hover:underline text-sm"><i class="fas fa-arrow-left mr-2"></i>返回訂單列表</a>
                    <h2 class="text-3xl font-bold text-gray-900 mt-2">${order.OrderNumber}</h2>
                </div>
                ${renderMainInfo(order)}
                ${renderLogisticsForm(order)}
                ${renderLineItems(orderId)}
            </div>`;
    }

    function renderMainInfo(order) {
        const buyer = findById('Buyers', order.BuyerID, 'BuyerID');
        const supplier = findById('Suppliers', order.SupplierID, 'SupplierID');
        const creator = findById('Users', order.CreatedByUserID, 'UserID');
        return `
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-xl font-bold text-gray-800 border-b pb-3 mb-4">訂單主資訊</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-x-6 gap-y-4 text-sm">
                    <div><strong class="block text-gray-500">訂單編號</strong> <span class="font-mono">${order.OrderNumber}</span></div>
                    <div><strong class="block text-gray-500">購買者</strong> ${buyer?.BuyerName}</div>
                    <div><strong class="block text-gray-500">供應商</strong> ${supplier?.SupplierName}</div>
                    <div><strong class="block text-gray-500">建立人</strong> ${creator?.FullName}</div>
                    <div><strong class="block text-gray-500">建立時間</strong> ${new Date(order.SystemCreatedAt).toLocaleString()}</div>
                    <div><strong class="block text-gray-500">支付方式</strong> ${order.PaymentMethod}</div>
                    <div><strong class="block text-gray-500">裝櫃時間</strong> ${new Date(order.LoadingTimestamp).toLocaleString()}</div>
                    <div><strong class="block text-gray-500">預計到貨時間</strong> ${new Date(order.ArrivalTimestamp).toLocaleString()}</div>
                </div>
            </div>`;
    }

    function renderLogisticsForm(order) {
        const inputClass = "mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm";
        const labelClass = "block text-sm font-medium text-gray-700";
        return `
            <div class="bg-white p-6 rounded-lg shadow-md">
                <div class="flex justify-between items-center border-b pb-3 mb-4">
                    <h3 class="text-xl font-bold text-gray-800">物流與進度管理</h3>
                    <button class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700 text-sm">儲存變更</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="space-y-6">
                        <div><label for="orderStatus" class="${labelClass}">訂單狀態</label><select id="orderStatus" class="${inputClass}"><option ${order.OrderStatus === 'Confirmed' ? 'selected' : ''}>Confirmed</option><option ${order.OrderStatus === 'Shipped' ? 'selected' : ''}>Shipped</option><option ${order.OrderStatus === 'Arrived' ? 'selected' : ''}>Arrived</option></select></div>
                        <div><label for="paymentStatus" class="${labelClass}">付款狀態</label><select id="paymentStatus" class="${inputClass}"><option ${order.PaymentStatus === 'Unpaid' ? 'selected' : ''}>Unpaid</option><option ${order.PaymentStatus === 'Partially Paid' ? 'selected' : ''}>Partially Paid</option><option ${order.PaymentStatus === 'Paid' ? 'selected' : ''}>Paid</option></select></div>
                        <div><label for="actualArrival" class="${labelClass}">實際到貨時間</label><input type="datetime-local" id="actualArrival" value="${formatDateTime(order.ActualArrivalTimestamp)}" class="${inputClass}"></div>
                    </div>
                    <div class="space-y-6">
                        <div><label for="bookingNumber" class="${labelClass}">Booking號碼</label><input type="text" id="bookingNumber" value="${order.BookingNumber || ''}" class="${inputClass}"></div>
                        <div><label for="containerNumber" class="${labelClass}">貨櫃號碼</label><input type="text" id="containerNumber" value="${order.ContainerNumber || ''}" class="${inputClass}"></div>
                    </div>
                    <div class="space-y-4">
                        <div><label for="loadProgress" class="${labelClass}">裝櫃進度</label><textarea id="loadProgress" rows="2" class="${inputClass}">${order.LoadProgress || ''}</textarea></div>
                        <div><label for="doaProgress" class="${labelClass}">文件進度</label><textarea id="doaProgress" rows="2" class="${inputClass}">${order.DoaProgress || ''}</textarea></div>
                        <div><label for="payProgress" class="${labelClass}">付款進度</label><textarea id="payProgress" rows="2" class="${inputClass}">${order.PayProgress || ''}</textarea></div>
                    </div>
                </div>
            </div>`;
    }

    function renderLineItems(orderId) {
        const lineItems = db.Order_Line_Items.filter(li => li.OrderID === orderId);
        return `
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-xl font-bold text-gray-800 border-b pb-3 mb-4">訂單品項列表</h3>
                <div class="overflow-x-auto"><table class="min-w-full text-sm">
                    <thead class="bg-gray-100"><tr>
                        <th class="p-3 text-left font-semibold">產品顯示名稱</th>
                        <th class="p-3 text-left font-semibold">規格</th>
                        <th class="p-3 text-left font-semibold">最終成交價(賣)</th>
                        <th class="p-3 text-left font-semibold">最終成本價(買)</th>
                        <th class="p-3 text-left font-semibold">重量 (kg)</th>
                    </tr></thead>
                    <tbody class="divide-y divide-gray-200">
                    ${lineItems.map(item => {
                        const product = findById('Products', item.ProductID, 'ProductID');
                        const spec = findById('Product_Specs', product?.SpecID, 'SpecID');
                        return `<tr>
                            <td class="p-3">${product?.ProductDisplayName || '-'}</td>
                            <td class="p-3">${spec?.SpecName_ZH || '-'}</td>
                            <td class="p-3 font-semibold">$${item.FinalSellingPrice.toLocaleString()}</td>
                            <td class="p-3 text-red-600">$${item.FinalCostPrice.toLocaleString()}</td>
                            <td class="p-3">${item.Weight.toFixed(2)}</td>
                        </tr>`
                    }).join('')}
                    </tbody>
                </table></div>
            </div>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
        highlightCurrentNav();
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = parseInt(urlParams.get('id'));
        if (orderId) {
            renderPage(orderId);
        } else {
            document.getElementById('page-content').innerHTML = `<div class="text-center text-red-500 font-bold">錯誤：URL 中缺少訂單 ID。</div>`;
        }
    });

</script>
</body>
</html>
